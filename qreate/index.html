<style>

*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--txt);font-family:'Comfortaa',ui-rounded,'Trebuchet MS',system-ui,sans-serif}

.body{display:flex;flex:1;min-height:0}

.crumb button:hover{color:var(--red)}
.card{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-bottom:10px;background:var(--paper);border:2px solid var(--red);color:var(--red);font-size:16px;cursor:pointer}
.card::after{content:"";position:absolute;right:0;bottom:0;width:18px;height:18px;background:conic-gradient(var(--red) 25%,var(--paper) 0 50%,var(--red) 0 75%,var(--paper) 0) 0 0/9px 9px;clip-path:polygon(100% 0,100% 100%,0 100%,0 50%,50% 50%,50% 0)}
.card:hover{background:var(--red);color:#fff}

.ctl{margin-bottom:14px}
.ctl>label,.ctl>.l{display:block;font-size:12px;color:var(--soft);margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;font-size:12px}
input[type=color]{width:34px;height:26px;border:2px solid var(--red);padding:0;background:none;cursor:pointer}

.seg button.on{background:var(--red);color:#fff}
.chkb{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.chkb input{-webkit-appearance:none;appearance:none;width:16px;height:16px;flex:none;border:2px solid var(--red);background:var(--paper);cursor:pointer;position:relative;margin:0}

main{flex:1;background:var(--main);min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;padding:8px 14px;background:var(--side);box-shadow:0 2px 6px #0001}
.top input{flex:1;min-width:0;height:38px;border:2px solid var(--line);background:var(--field);padding:0 14px;font-size:15px;outline:0}

.top .go{border-color:var(--red)}.top .go:hover{background:var(--red-d);color:#fff}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 44px;position:relative}
.sz{position:absolute;top:12px;left:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#555;color:#fff;padding:2px 6px}
.canvas{width:min(100%,380px);aspect-ratio:1;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 14px #0002;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;color:#000;padding:14px}

.canvas svg{width:100%;height:100%;display:block}

.view.g{cursor:grabbing}.canvas{flex:none}
.msg{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;color:var(--red);min-height:20px;padding:0 12px}
@media (max-width:860px){
 header{padding-left:12px}header .logo{--u:3px}.dom,.cg{display:none}.menus{margin-left:6px}.menu>button{padding:8px 6px}.tbtn{margin-left:auto;margin-right:8px}

/* ---------- multiple qr codes ---------- */

   const base=(q.name.trim()||'untitled_qr').replace(/[\\\/:*?"<>|']/g,'_');let nm=base,n=2;
   while(used.has((nm+'.'+fmt).toLowerCase()))nm=base+'_'+n++;used.add((nm+'.'+fmt).toLowerCase());
   const blob=fmt==='svg'?new Blob([withState(q.s,()=>build(q.s.size).svg)],{type:'image/svg+xml'}):await raster(fmt,q.s);
   files.push({name:nm+'.'+fmt,data:new Uint8Array(await blob.arrayBuffer())})}
  await saveFile('qreate-qrs.zip',makeZip(files,'qreate-qrs'));
  toast(`saved ${files.length} qr code${files.length>1?'s':''} as qreate-qrs.zip (it unzips to a folder)${skipped?`. skipped ${skipped} empty code${skipped>1?'s':''}.`:'.'}`,'ok',7000)}
 catch(e){if(!e||e.code!=='declined')say('export failed: '+((e&&e.message)||'unknown error'))}
 finally{exporting=false;updateBar()}}
const ACT={
 new(){Object.assign(S,JSON.parse(JSON.stringify(S0)));txt.value='';go(cur);draw()},
 addqr(){addQ(false)},dupqr(){addQ(true)},
 delqr(){if(Q.length<2)return say('you need at least one qr code.');removeQ(A)},
 exportall(){return exportAll()},
 import(){$('#imp').click()},
 savejson(){saveFile('qreate-settings.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'})).catch(()=>{})},
 async copysvg(){if(need())return;try{await navigator.clipboard.writeText(build(S.size).svg);say('svg code copied.')}catch(e){say('copy was blocked here. use export > svg instead.')}},
 async copyimg(){if(need())return;try{const b=await raster('png');await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);say('image copied.')}catch(e){say('copy was blocked here. use export instead.')}},
 undo(){if(hi>0){hi--;restore()}},redo(){if(hi<hist.length-1){hi++;restore()}},
 invert(){[S.fg,S.bg]=[S.bg,S.fg];S.tr=false;S.grad=false;go(cur);draw()},
 swap(){[S.fg,S.fg2]=[S.fg2,S.fg];go(cur);draw()},
 random(){RANDOM();go(cur);draw()},
 help(){toast('ctrl+z undo · ctrl+y redo · ctrl+enter export · + / - / 0 zoom · esc back · click a code on the board to edit it · click the center text or label to edit · drop or paste an image for the center','ok',10000)}};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>ACT[b.dataset.a]());
const closeMenus=()=>document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
document.querySelectorAll('.menu>button').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=b.parentNode,o=m.classList.contains('open');closeMenus();if(!o)m.classList.add('open')});
document.addEventListener('click',closeMenus);
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{Object.assign(S,JSON.parse(t));txt.value=S.text;go(cur);draw()}).catch(()=>say('that file is not a QReate settings file.'));e.target.value=''};
/* ---------- test scan ---------- */
let tmr;function toast(t,kind,ms){const e=$('#toast');$('#tt').textContent=t;e.className='show '+kind;clearTimeout(tmr);if(ms)tmr=setTimeout(()=>e.classList.remove('show'),ms)}
$('#tx').onclick=()=>$('#toast').classList.remove('show');
async function scanCanvas(sz,blur){const b=build(sz,true),h=Math.round(sz*b.H/b.T),img=new Image();
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(b.svg);await img.decode();
 const c=document.createElement('canvas');c.width=sz;c.height=h;const x=c.getContext('2d');
 x.fillStyle=S.tr?'#fff':S.bg;x.fillRect(0,0,sz,h);x.drawImage(img,0,0,sz,h);
 const k=sz/b.T;await drawText(x,b,k,S.fw,S.font)
 if(!blur)return c;const c2=document.createElement('canvas');c2.width=sz;c2.height=h;const y=c2.getContext('2d');y.filter=`blur(${blur}px)`;y.drawImage(c,0,0);return c2}
async function testScan(){if(need())return;const btn=$('#tscan');btn.textContent='scanning…';btn.disabled=true;
 try{if(!window.jsQR){toast('the scanner library failed to load. check your connection.','warn',8000);return}
  const res=[];for(const [sz,bl] of [[700,0],[360,0],[220,1],[160,.8]]){const c=await scanCanvas(sz,bl),d=c.getContext('2d').getImageData(0,0,c.width,c.height);res.push(!!jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'}))}
  const n=res.filter(Boolean).length;
  if(res[0]&&n>=3)toast(`scan test passed. it decoded in ${n} of 4 tests, including small and blurry versions.`,'ok',5000);
  else if(res[0])toast('it scans when sharp, but cameras may struggle to scan it when small, blurry or in low light. try more contrast, a bigger margin or a simpler style.','warn',14000);
  else toast('cameras may struggle to scan this code. try more contrast, a bigger margin, a smaller center mark or a simpler module style.','warn',14000)}
 catch(e){toast('the test could not run: '+((e&&e.message)||'unknown error'),'warn',8000)}
 finally{btn.textContent='test scan';btn.disabled=false}}
$('#tscan').onclick=testScan;
let acT;function autoCheck(){const b=$('#tscan');if(!S.autoscan||!window.jsQR||!payload()){b.removeAttribute('data-s');return}clearTimeout(acT);b.dataset.s='wait';
 acT=setTimeout(async()=>{try{const res=[];for(const [sz,bl] of [[700,0],[360,0],[220,1],[160,.8]]){const c=await scanCanvas(sz,bl),d=c.getContext('2d').getImageData(0,0,c.width,c.height);res.push(!!jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'}))}const n=res.filter(Boolean).length;b.dataset.s=(res[0]&&n>=3)?'ok':'warn'}catch(e){b.removeAttribute('data-s')}},700)}
/* ---------- zoom + pan ---------- */
const view=$('#view'),Z={k:1,x:0,y:0},pts=new Map();
function applyZ(){board.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.k})`;$('#zl').textContent=Math.round(Z.k*100)+'%';view.style.touchAction=Z.k>1.01?'none':'pan-y'}
function zoomAt(f,cx,cy){const nk=Math.min(12,Math.max(.2,Z.k*f)),g=nk/Z.k;Z.x=cx-(cx-Z.x)*g;Z.y=cy-(cy-Z.y)*g;Z.k=nk;applyZ()}
const ctr=()=>{const r=view.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
view.addEventListener('wheel',e=>{e.preventDefault();const[cx,cy]=ctr();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-cx,e.clientY-cy)},{passive:false});
let dn=null;
view.onpointerdown=e=>{view.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);view.classList.add('g');dn=pts.size===1?{x:e.clientX,y:e.clientY}:null};
view.onpointermove=e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId),nw=[e.clientX,e.clientY];
 if(dn&&(pts.size>1||Math.hypot(e.clientX-dn.x,e.clientY-dn.y)>5))dn=null;
 if(pts.size===1){Z.x+=nw[0]-o[0];Z.y+=nw[1]-o[1];pts.set(e.pointerId,nw);applyZ()}
 else if(pts.size===2){const ids=[...pts.keys()],o2=pts.get(ids[0]===e.pointerId?ids[1]:ids[0]),d0=Math.hypot(o[0]-o2[0],o[1]-o2[1]),d1=Math.hypot(nw[0]-o2[0],nw[1]-o2[1]),[cx,cy]=ctr();
  zoomAt(d1/(d0||1),(nw[0]+o2[0])/2-cx,(nw[1]+o2[1])/2-cy);Z.x+=(nw[0]-o[0])/2;Z.y+=(nw[1]-o[1])/2;pts.set(e.pointerId,nw);applyZ()}};
view.onpointerup=e=>{const tap=pts.size===1&&dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<6;pts.delete(e.pointerId);if(!pts.size)view.classList.remove('g');dn=null;
 if(tap&&Q.length>1){const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.qc');if(c)switchTo(+c.dataset.i)}};
view.onpointercancel=e=>{pts.delete(e.pointerId);if(!pts.size)view.classList.remove('g');dn=null};
const resetZ=()=>fitView();
function loadLogo(f){if(!f||!/^image\//.test(f.type))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');if(cur==='center')go('center');draw();say('image placed in the center.')};im.src=r.result};r.readAsDataURL(f)}
view.addEventListener('dragover',e=>e.preventDefault());view.addEventListener('drop',e=>{e.preventDefault();loadLogo(e.dataTransfer.files[0])});
document.addEventListener('paste',e=>{const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.startsWith('image/'));if(it)loadLogo(it.getAsFile())});
view.ondblclick=resetZ;$('#zr').onclick=resetZ;$('#zi').onclick=()=>zoomAt(1.25,0,0);$('#zo').onclick=()=>zoomAt(.8,0,0);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;if(e.key==='+'||e.key==='=')zoomAt(1.25,0,0);else if(e.key==='-')zoomAt(.8,0,0);else if(e.key==='0')resetZ()});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey,inp=/INPUT|TEXTAREA/.test(e.target.tagName);
 if(mod&&k==='enter'){e.preventDefault();doExport()}
 else if(mod&&!inp&&k==='z'){e.preventDefault();e.shiftKey?ACT.redo():ACT.undo()}
 else if(mod&&!inp&&k==='y'){e.preventDefault();ACT.redo()}});
$('#fname').value=Q[A].name;Q[A].s=clone(S);renderBoard();fitView();
draw();
