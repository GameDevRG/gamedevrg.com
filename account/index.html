<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>gamedevrg.com/account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --blue: #3b82f6;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --red: #f87171;
            --green: #22c55e;
            --amber: #fbbf24;
            --line: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            background: var(--blue);
            font-family: "Chakra Petch", sans-serif;
            color: var(--text);
        }

        :focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* ---------- panel ---------- */
        .panel {
            width: 100%;
            max-width: 920px;
            padding: 32px;
            background: linear-gradient(145deg, #002155, #000000);
            border: 1px solid var(--line);
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .panel.wide {
            max-width: 1280px;
        }

        h1,
        h2 {
            margin: 0;
        }

        .title {
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: 700;
            color: var(--blue);
            text-align: center;
        }

        /* ---------- buttons ---------- */
        .btn {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 12px;
            border: 1px solid transparent;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .primary {
            background: var(--blue);
        }

        .secondary {
            background: transparent;
            border-color: var(--blue);
            color: var(--blue);
        }

        .success {
            background: var(--green);
        }

        .danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: var(--red);
        }

        .danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
        }

        .back {
            display: inline-block;
            width: auto;
            min-height: 0;
            margin-bottom: 24px;
            padding: 8px 14px;
            font-weight: 500;
            font-size: 15px;
        }

        /* ---------- tabs ---------- */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 24px;
            border: 1px solid var(--blue);
        }

        .tab {
            padding: 12px 8px;
            border: 0;
            background: transparent;
            color: var(--blue);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .tab[aria-selected="true"] {
            background: var(--blue);
            color: #fff;
        }

        /* ---------- form fields ---------- */
        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--blue);
            border-radius: 0;
            background: #000;
            color: var(--text);
            font: inherit;
            font-size: 16px;
            /* 16px stops iOS zooming into the field */
        }

        .has-reveal input {
            padding-right: 52px;
        }

        .reveal {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--blue);
            cursor: pointer;
        }

        .reveal:hover {
            color: #fff;
        }

        .reveal svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .msg {
            min-height: 1.4em;
            margin: 14px 0 0;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .msg.err {
            color: var(--red);
        }

        .msg.ok {
            color: #86efac;
        }

        /* ---------- account view ---------- */
        .welcome {
            font-size: 20px;
            font-weight: 400;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .username {
            margin-bottom: 24px;
            font-size: clamp(32px, 10vw, 48px);
            font-weight: 700;
            line-height: 1.1;
            color: var(--blue);
            overflow-wrap: anywhere;
        }

        .status {
            margin-bottom: 24px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-left: 3px solid var(--blue);
            background: rgba(255, 255, 255, 0.04);
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .status.ok {
            border-left-color: var(--green);
        }

        .status.warn {
            border-left-color: var(--amber);
        }

        .status.err {
            border-left-color: var(--red);
        }

        .status small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 13px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ---------- account data ---------- */
        .data {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat {
            padding: 12px;
            border: 1px solid var(--line);
            font-size: 14px;
            color: var(--muted);
        }

        .stat b {
            display: block;
            font-size: 28px;
            color: var(--blue);
        }

        .sub {
            margin: 0 0 10px;
            font-size: 16px;
            font-weight: 600;
            color: var(--muted);
        }

        .empty {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 15px;
        }

        .tablewrap {
            margin-bottom: 24px;
            overflow-x: auto;
            border: 1px solid var(--line);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        details summary {
            padding: 4px 0 10px;
            color: var(--muted);
            font-weight: 600;
            cursor: pointer;
        }

        pre {
            max-height: 320px;
            margin: 0;
            padding: 12px;
            overflow: auto;
            border: 1px solid var(--line);
            background: #000;
            font-size: 13px;
        }

        /* ---------- server unreachable popup ---------- */
        dialog {
            width: calc(100% - 32px);
            max-width: 420px;
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 0;
            background: linear-gradient(145deg, #002155, #000000);
            color: var(--text);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        dialog h2 {
            margin-bottom: 10px;
            font-size: 22px;
            color: var(--red);
        }

        dialog p {
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
        }

        .dialog-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .dialog-actions .btn {
            flex: 1;
        }

        /* ---------- mobile ---------- */
        @media (max-width: 480px) {
            .panel {
                padding: 24px 18px;
            }

            .title {
                font-size: 24px;
            }

            .stat b {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="panel" id="panel">

        <a class="btn secondary back" id="backLink" href="index.html" data-i18n="back">◁ back</a>

        <!-- ===== SIGNED OUT: log in / create account ===== -->
        <section id="authView">
            <h1 class="title" id="authTitle" data-i18n="signIn">sign in</h1>

            <div class="tabs" role="tablist">

                <button type="button" class="tab" id="tabRegister" role="tab" aria-selected="false"
                    data-i18n="createAccount">create account</button>
            </div>

            <form id="loginForm">
                <div class="field">
                    <label for="username" data-i18n="username">username</label>
                    <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
                        required>
                </div>
                <div class="field">
                    <label for="password" data-i18n="password">password</label>
                    <div class="input-wrap has-reveal">
                        <input id="password" type="password" autocomplete="current-password" required>
                        <button type="button" class="reveal" data-reveal="password" aria-pressed="false"></button>
                    </div>
                </div>
                <button type="submit" class="btn primary" id="loginBtn" data-i18n="logIn">log in</button>
            </form>

            <form id="registerForm" hidden>
                <div class="field">
                    <label for="regUsername" data-i18n="username">username</label>
                    <input id="regUsername" type="text" autocomplete="username" autocapitalize="none"
                        spellcheck="false" required>
                </div>
                <div class="field">
                    <label for="regPassword" data-i18n="password">password</label>
                    <div class="input-wrap has-reveal">
                        <input id="regPassword" type="password" autocomplete="new-password" required>
                        <button type="button" class="reveal" data-reveal="regPassword" aria-pressed="false"></button>
                    </div>
                </div>
                <div class="field">
                    <label for="regConfirm" data-i18n="confirmPassword">confirm password</label>
                    <div class="input-wrap has-reveal">
                        <input id="regConfirm" type="password" autocomplete="new-password" required>
                        <button type="button" class="reveal" data-reveal="regConfirm" aria-pressed="false"></button>
                    </div>
                </div>
                <button type="submit" class="btn success" id="registerBtn" data-i18n="register">register</button>
            </form>

            <p class="msg" id="authMsg" role="status" aria-live="polite"></p>
        </section>

        <!-- ===== SIGNED IN: account ===== -->
        <section id="accountView" hidden>
            <h1 class="welcome" data-i18n="welcomeBack">welcome back,</h1>
            <div class="username" id="usernameDisplay"></div>

            <div class="status" id="status" role="status" aria-live="polite"></div>

            <div class="actions">
                <button type="button" class="btn secondary" id="refreshBtn" data-i18n="refreshLogin">refresh login</button>
                <button type="button" class="btn primary" id="dataBtn" aria-expanded="false" aria-controls="dataPanel"
                    data-i18n="viewData">view account data</button>
                <button type="button" class="btn danger" id="logoutBtn" data-i18n="logOut">log out</button>
            </div>

            <section class="data" id="dataPanel" hidden>
                <form id="dataForm">
                    <div class="field">
                        <label for="dataPw" data-i18n="dataPrompt">enter your password to view your data</label>
                        <div class="input-wrap has-reveal">
                            <input id="dataPw" type="password" autocomplete="current-password" required>
                            <button type="button" class="reveal" data-reveal="dataPw" aria-pressed="false"></button>
                        </div>
                    </div>
                    <button type="submit" class="btn primary" id="loadBtn" data-i18n="loadData">load data</button>
                </form>
                <p class="msg" id="dataMsg" role="status" aria-live="polite"></p>
                <div id="dataResult" hidden></div>
            </section>
        </section>

    </main>

    <dialog id="serverDialog" aria-labelledby="serverDialogTitle">
        <h2 id="serverDialogTitle" data-i18n="serverDownTitle">can't reach the server</h2>
        <p data-i18n="serverDownBody">the server didn't respond. It may be waking up from sleep, or your connection may be down. Check your connection and try again in a moment.</p>
        <div class="dialog-actions">
            <button type="button" class="btn secondary" id="serverClose" data-i18n="close">close</button>
            <button type="button" class="btn primary" id="serverRetry" data-i18n="tryAgain">try again</button>
        </div>
    </dialog>

                noScores: "暂无排行榜成绩", noDaily: "暂未完成每日关卡", rawData: "原始数据",
                serverDownTitle: "无法连接服务器",
                serverDownBody: "服务器没有响应。它可能正在唤醒，或者你的网络已断开。请检查网络，稍后再试。",
                close: "关闭", tryAgain: "重试"
            }
        };

        const lang = translations[localStorage.getItem("lang")] ? localStorage.getItem("lang") : "en";
        const t = key => translations[lang][key] || translations.en[key] || key;

        function applyLanguage() {
            document.documentElement.lang = lang;
            document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
        }

        function setI18n(el, key) {
            el.dataset.i18n = key;
            el.textContent = t(key);
        }

        /* ---------- helpers ---------- */
        function setMsg(el, text, kind) {
            el.textContent = text || "";
            el.className = "msg" + (kind ? " " + kind : "");
        }

        function setStatus(kind, text, sub) {
            const s = $("status");
            s.className = "status " + kind;
            s.textContent = text;
            if (sub) {
                const small = document.createElement("small");
                small.textContent = sub;
                s.appendChild(small);
            }
        }

        /* POST to the backend. onSlow fires if the server takes >5s (free hosting sleeps when idle). */
        async function api(path, body, onSlow) {
            const ctrl = new AbortController();
            const kill = setTimeout(() => ctrl.abort(), 60000);
            const slow = onSlow ? setTimeout(onSlow, 5000) : null;
            try {
                const res = await fetch(API + path, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                    signal: ctrl.signal
                });
                /* 502/503/504 come from the host while the server is asleep or down */
                if (res.status === 502 || res.status === 503 || res.status === 504) throw new Error("server unreachable");
                let data = null;
                try { data = await res.json(); } catch (e) { }
                return { ok: res.ok, status: res.status, data: data || {} };
            } finally {
                clearTimeout(kill);
                if (slow) clearTimeout(slow);
            }
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
        }

        function makeTable(headers, rows) {
            const wrap = el("div", "tablewrap");
            const tb = el("table");
            const head = el("tr");
            headers.forEach(h => { const th = el("th", null, h); th.scope = "col"; head.appendChild(th); });
            tb.appendChild(el("thead")).appendChild(head);
            const body = el("tbody");
            rows.forEach(r => {
                const tr = el("tr");
                r.forEach(c => tr.appendChild(el("td", null, c)));
                body.appendChild(tr);
            });
            tb.appendChild(body);
            wrap.appendChild(tb);
            return wrap;
        }

        /* ---------- views ---------- */
        function clearLogin() {
            localStorage.removeItem("loggedIn");
            localStorage.removeItem("username");
        }

        function showAuth(msg, kind) {
            $("accountView").hidden = true;
            $("authView").hidden = false;
            $("panel").classList.remove("wide");
            closeData();
            setTab("login");
            setMsg($("authMsg"), msg, kind);
        }

        function showAccount() {
            $("authView").hidden = true;
            $("accountView").hidden = false;
            $("panel").classList.add("wide");
            $("usernameDisplay").textContent = localStorage.getItem("username");
            checkAccount();
        }

        function setTab(name) {
            const login = name === "login";
            $("loginForm").hidden = !login;
            $("registerForm").hidden = login;
            $("tabLogin").setAttribute("aria-selected", login);
            $("tabRegister").setAttribute("aria-selected", !login);
            setI18n($("authTitle"), login ? "signIn" : "createAccount");
            setMsg($("authMsg"), "");
        }

        $("tabLogin").onclick = () => setTab("login");
        $("tabRegister").onclick = () => {
            /* carry over whatever was already typed (never into confirm password) */
            if ($("username").value) $("regUsername").value = $("username").value;
            if ($("password").value) $("regPassword").value = $("password").value;
            setTab("register");
        };

        /* show / hide password buttons (eye icons) */
        const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M1 1l22 22"/></svg>';

        document.querySelectorAll("[data-reveal]").forEach(btn => {
            btn.innerHTML = EYE;
            btn.setAttribute("aria-label", t("show"));
            btn.addEventListener("click", () => {
                const input = $(btn.dataset.reveal);
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                btn.innerHTML = show ? EYE_OFF : EYE;
                btn.setAttribute("aria-label", t(show ? "hide" : "show"));
                btn.setAttribute("aria-pressed", show);
            });
        });

        /* ---------- popup when the server can't be reached ---------- */
        let retryForm = null;

        function showServerDown(form) {
            retryForm = form;
            if (!$("serverDialog").open) $("serverDialog").showModal();
        }

        $("serverClose").onclick = () => $("serverDialog").close();
        $("serverRetry").onclick = () => {
            $("serverDialog").close();
            if (retryForm) retryForm.requestSubmit();
        };

        /* ---------- log in ---------- */
        $("loginForm").addEventListener("submit", async e => {
            e.preventDefault();
            const username = $("username").value;
            const password = $("password").value;
            if (!username || !password) return setMsg($("authMsg"), t("fillAll"), "err");

            $("loginBtn").disabled = true;
            setMsg($("authMsg"), t("loggingIn"));
            try {
                const r = await api("/login", { username, password }, () => setMsg($("authMsg"), t("wakeUp")));
                if (!r.ok) return setMsg($("authMsg"), (r.data.message || t("serverError")), "err");

                localStorage.setItem("loggedIn", "true");
                localStorage.setItem("username", username);
                $("password").value = "";
                showAccount();
            } catch (err) {
                console.error(err);
                setMsg($("authMsg"), t("serverError"), "err");
                showServerDown($("loginForm"));
            } finally {
                $("loginBtn").disabled = false;
            }
        });

        /* ---------- create account (with password confirmation) ---------- */
        $("registerForm").addEventListener("submit", async e => {
            e.preventDefault();
            const username = $("regUsername").value;
            const password = $("regPassword").value;
            const confirm = $("regConfirm").value;
            if (!username || !password) return setMsg($("authMsg"), t("fillAll"), "err");
            if (password !== confirm) return setMsg($("authMsg"), t("mismatch"), "err");

            $("registerBtn").disabled = true;
            setMsg($("authMsg"), t("creating"));
            try {
                const r = await api("/register", { username, password }, () => setMsg($("authMsg"), t("wakeUp")));
                if (!r.ok) return setMsg($("authMsg"), (r.data.message || t("serverError")), "err");

                $("registerForm").reset();
                setTab("login");
                $("username").value = username;
                $("password").focus();
                setMsg($("authMsg"), t("created"), "ok");
            } catch (err) {
                console.error(err);
                setMsg($("authMsg"), t("serverError"), "err");
                showServerDown($("registerForm"));
            } finally {
                $("registerBtn").disabled = false;
            }
        });

        /* ---------- refresh login: does this account still exist on the server? ---------- */
        async function checkAccount() {
            const username = localStorage.getItem("username");
            $("refreshBtn").disabled = true;
            setStatus("busy", t("checking"));
            try {
                const r = await api("/account/check", { username }, () => setStatus("busy", t("wakeUp")));
                if (r.ok && r.data.exists === true) {
                    const time = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
                    setStatus("ok", t("confirmed"), t("checkedAt") + " " + time);
                } else if (r.ok && r.data.exists === false) {
                    clearLogin();
                    showAuth(t("notFound"), "err");
                } else {
                    setStatus("warn", t("unreachable"));
                }
            } catch (err) {
                console.error(err);
                setStatus("warn", t("unreachable"));
            } finally {
                $("refreshBtn").disabled = false;
            }
        }

        $("refreshBtn").onclick = checkAccount;

        /* ---------- log out ---------- */
        $("logoutBtn").onclick = () => {
            clearLogin();
            showAuth();
        };

        /* ---------- view account data ---------- */
        function closeData() {
            $("dataPanel").hidden = true;
            $("dataBtn").setAttribute("aria-expanded", "false");
            setI18n($("dataBtn"), "viewData");
            $("dataResult").hidden = true;
            $("dataResult").replaceChildren();
            $("dataPw").value = "";
            setMsg($("dataMsg"), "");
        }

        $("dataBtn").onclick = () => {
            if ($("dataPanel").hidden) {
                $("dataPanel").hidden = false;
                $("dataBtn").setAttribute("aria-expanded", "true");
                setI18n($("dataBtn"), "hideData");
                $("dataPw").focus();
            } else {
                closeData();
            }
        };

        const PAC = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit" });

        $("dataForm").addEventListener("submit", async e => {
            e.preventDefault();
            const username = localStorage.getItem("username");
            $("loadBtn").disabled = true;
            setMsg($("dataMsg"), t("loading"));
            try {
                const r = await api("/account/data", { username, password: $("dataPw").value }, () => setMsg($("dataMsg"), t("wakeUp")));
                if (!r.ok) return setMsg($("dataMsg"), (r.data.message || t("serverError")), "err");
                $("dataPw").value = "";
                setMsg($("dataMsg"), "");
                renderData(r.data.account || {});
            } catch (err) {
                console.error(err);
                setMsg($("dataMsg"), t("serverError"), "err");
            } finally {
                $("loadBtn").disabled = false;
            }
        });

        function renderData(account) {
            const scores = Object.entries(account.scores || {});
            const daily = Object.entries(account.daily || {}).sort((a, b) => b[0].localeCompare(a[0]));
            const out = $("dataResult");
            out.replaceChildren();

            const stats = el("div", "stats");
            [[scores.length, "leaderboardScores"], [daily.length, "dailySolved"]].forEach(([n, key]) => {
                const s = el("div", "stat", t(key));
                s.prepend(el("b", null, n));
                stats.appendChild(s);
            });
            out.appendChild(stats);

            out.appendChild(el("h2", "sub", t("leaderboardScores")));
            out.appendChild(scores.length
                ? makeTable([t("leaderboard"), t("bestTime")], scores.map(([name, time]) => [name, time]))
                : el("p", "empty", t("noScores")));

            out.appendChild(el("h2", "sub", t("dailySolved")));
            out.appendChild(daily.length
                ? makeTable([t("date"), t("moves"), t("par"), t("result")], daily.map(([d, x]) => {
                    const late = PAC.format(new Date(x.first || x.at)) > d;
                    return [d, x.moves, x.par != null ? x.par : "–", late ? t("late") : t("onTime")];
                }))
                : el("p", "empty", t("noDaily")));

            const details = el("details");
            details.appendChild(el("summary", null, t("rawData")));
            details.appendChild(el("pre", null, JSON.stringify(account, null, 2)));
            out.appendChild(details);

            out.hidden = false;
        }

        /* ---------- start ---------- */
        setI18n($("backLink"), fromDaily ? "backDaily" : "back");
        $("backLink").href = fromDaily ? "../mathgolf/daily/" : "index.html";
        applyLanguage();

        if (localStorage.getItem("loggedIn") === "true" && localStorage.getItem("username")) {
            showAccount();
        }
    </script>
</body>

</html>
