<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>online levels · hole in √-1</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Chakra+Petch:ital,wght@0,400;0,500;0,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #10162a;
            --grid: #1c2542;
            --ink: #e9edfa;
            --soft: #8f9bc0;
            --card: #192040;
            --imag: #ff6fa5;
            --sand: #d4a64f;
            --ok: #4fd49b;
            --line: #2d3861;
            --blue: #7cc8ff;
            --red: #e5484d;
            --yellow: #ffd54a;
            --gold: #ffe08a;
            --orange: #ff9a3c;
            --purple: #b48cff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        :root[data-theme="light"] {
            --bg: #eef1f6;
            --grid: #d5dbe8;
            --ink: #14213d;
            --soft: #5d6b8a;
            --card: #fff;
            --imag: #c2185b;
            --sand: #a9791c;
            --ok: #1b8a5a;
            --line: #c3cbdd;
            --blue: #3a9be0;
            --red: #d32f2f;
            --yellow: #b7791f;
            --gold: #e0a526;
            --orange: #e8730c;
            --purple: #7a3fe0
        }

        * {
            box-sizing: border-box
        }

        [hidden] {
            display: none !important
        }

        html {
            scroll-padding-top: calc(52px + env(safe-area-inset-top, 0px))
        }

        body {
            margin: 0;
            min-height: 100dvh;
            background-color: var(--bg);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--ink);
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            text-align: center;
            text-transform: lowercase;
            overflow-x: hidden
        }

        .pg {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: calc(38px + 6vh) 16px calc(40px + env(safe-area-inset-bottom, 0px))
        }

        header {
            margin-bottom: 18px
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.02em
        }

        h1 .rad {
            position: relative;
            display: inline-block;
            padding-left: .5em;
            color: var(--imag);
            white-space: nowrap;
            line-height: 1;
            vertical-align: baseline
        }

        h1 .rad svg {
            position: absolute;
            left: 0;
            top: 0;
            width: .5em;
            height: 100%;
            overflow: visible;
            display: block
        }

        h1 .vin {
            position: relative;
            display: inline-block;
            line-height: .95;
            padding: .2em 3px 0 1px;
            margin-left: -1px
        }

        h1 .vin::before {
            content: "";
            position: absolute;
            left: -1px;
            right: 0;
            top: -1.5px;
            height: 3px;
            background: currentColor
        }

        h2.pgh {
            margin: 14px 0 0;
            font-size: 2rem;
            font-weight: 800;
            color: var(--purple)
        }

        .sub {
            color: var(--soft);
            margin: 4px 0 0;
            font-size: .95rem
        }

        /* ---------- site top bar (same as the other pages) ---------- */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            height: calc(38px + env(safe-area-inset-top, 0px));
            padding: env(safe-area-inset-top, 0px) 12px 0;
            background: #000;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Chakra Petch', system-ui, sans-serif;
            text-align: left;
            text-transform: lowercase;
            white-space: nowrap
        }

        #topbar .logo {
            flex: 0 0 auto;
            margin-right: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -.01em;
            text-decoration: none;
            line-height: 1
        }

        #topbar .logo small {
            font-size: .62em;
            font-weight: 500;
            color: #cfcfcf;
            letter-spacing: 0
        }

        #topbar .tbtn {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 26px;
            padding: 0 20px;
            border: 0;
            background: #3b82f6;
            color: #fff;
            font-family: inherit;
            font-weight: 500;
            font-size: 15px;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            cursor: pointer
        }

        #topbar .tbtn:hover {
            background: #5a95f7
        }

        #topbar #tacct {
            margin-left: auto
        }

        #topbar .twho {
            flex: 0 1 auto;
            min-width: 0;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #cfcfcf;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none
        }

        #topbar .twho b {
            color: #fff;
            font-weight: 700;
            text-transform: none
        }

        #topbar .twho:hover {
            text-decoration: underline
        }

        #topbar .logo:focus-visible,
        #topbar .tbtn:focus-visible,
        #topbar .twho:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px
        }

        /* ---------- controls ---------- */
        .panel {
            background: var(--card);
            border: 2px solid var(--line);
            padding: 14px;
            text-align: left
        }

        .searchrow {
            display: flex;
            gap: 8px
        }

        input[type="search"],
        input[type="password"],
        select {
            width: 100%;
            min-width: 0;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            padding: 9px 10px;
            border: 2px solid var(--line);
            border-radius: 0;
            background: var(--bg);
            color: var(--ink);
            text-transform: none;
            -webkit-appearance: none;
            appearance: none
        }

        input::placeholder {
            color: var(--soft);
            opacity: .7;
            font-weight: 600
        }

        select {
            text-transform: lowercase;
            padding-right: 28px;
            background-image: linear-gradient(45deg, transparent 50%, var(--soft) 50%), linear-gradient(135deg, var(--soft) 50%, transparent 50%);
            background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px
        }

        .filters label {
            display: block;
            font-size: .8rem;
            color: var(--soft);
            margin-bottom: 3px
        }

        @media (max-width: 480px) {
            .filters {
                grid-template-columns: 1fr 1fr
            }

            .filters .wide {
                grid-column: 1 / -1
            }
        }

        .btn,
        .tools button {
            min-height: 44px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            border: 2px solid var(--line);
            background: var(--card);
            color: var(--ink);
            cursor: pointer;
            text-decoration: none;
            text-transform: lowercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0
        }

        .btn.sm {
            min-height: 36px;
            padding: 6px 12px;
            font-size: .9rem
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .btn.go {
            border-color: var(--purple);
            color: var(--purple);
            background: var(--bg);
            box-shadow: 0 3px 0 var(--purple)
        }

        .btn.go:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--purple)
        }

        .btn.danger {
            border-color: var(--red);
            color: var(--red)
        }

        .btn.on {
            border-color: var(--purple);
            color: var(--purple)
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 10px
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 6px 5px 12px;
            border: 2px solid var(--purple);
            color: var(--purple);
            font-weight: 700;
            font-size: .9rem
        }

        .chip b {
            text-transform: none
        }

        .chip button {
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            font-size: 1.2rem;
            line-height: 1;
            padding: 0 6px;
            cursor: pointer
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px
        }

        /* ---------- results ---------- */
        #count {
            margin: 16px 0 8px;
            color: var(--soft);
            font-size: .9rem;
            min-height: 1.3em
        }

        #list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0;
            margin: 0;
            list-style: none
        }

        .lv {
            background: var(--card);
            border: 2px solid var(--line);
            padding: 14px;
            text-align: left
        }

        .lv .top {
            display: flex;
            gap: 10px;
            align-items: baseline;
            justify-content: space-between
        }

        .lv h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: none;
            overflow-wrap: anywhere
        }

        .lv h3.none {
            color: var(--soft);
            font-style: italic;
            font-weight: 700;
            text-transform: lowercase
        }

        .dv {
            flex: none;
            font-size: .75rem;
            font-weight: 800;
            padding: 2px 8px;
            border: 2px solid var(--c, var(--line));
            color: var(--c, var(--soft))
        }

        .dv2 {
            --c: var(--ok)
        }

        .dv4 {
            --c: var(--yellow)
        }

        .dv6 {
            --c: var(--orange)
        }

        .dv8 {
            --c: var(--imag)
        }

        .by {
            margin: 4px 0 0;
            font-size: .9rem;
            color: var(--soft)
        }

        .by .au {
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            font-weight: 800;
            color: var(--purple);
            text-transform: none;
            text-decoration: underline;
            cursor: pointer
        }

        .route {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin: 10px 0 0
        }

        .route .n {
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: none
        }

        .route .arrow {
            color: var(--soft)
        }

        .route .op {
            font-size: .85rem;
            font-weight: 700;
            padding: 1px 7px;
            border: 1px solid var(--line);
            color: var(--soft);
            text-transform: none
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px
        }

        .tags span {
            font-size: .8rem;
            font-weight: 700;
            padding: 1px 8px;
            background: var(--bg);
            border: 1px solid var(--line);
            color: var(--soft)
        }

        .tags .sandtag {
            color: var(--sand);
            border-color: var(--sand)
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 2px 14px;
            margin-top: 8px;
            font-size: .85rem;
            font-weight: 700;
            color: var(--soft)
        }

        .acts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px
        }

        .state {
            padding: 28px 10px;
            color: var(--soft)
        }

        .state.err {
            color: var(--imag)
        }

        .spin {
            display: inline-block;
            width: 26px;
            height: 26px;
            border: 3px solid var(--line);
            border-top-color: var(--purple);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            vertical-align: middle
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #more {
            margin-top: 14px
        }

        .foot {
            margin-top: 26px;
            color: var(--soft);
            font-size: .9rem
        }

        .foot .btn {
            margin-top: 10px
        }

        /* ---------- delete dialog + toast ---------- */
        dialog {
            width: min(92vw, 420px);
            max-width: 420px;
            padding: 20px 18px 18px;
            border: 2px solid var(--ink);
            background: var(--card);
            color: var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            text-align: center;
            text-transform: lowercase;
            font-family: inherit
        }

        dialog::backdrop {
            background: rgba(5, 7, 15, .6)
        }

        dialog h3 {
            margin: 0 0 6px;
            font-size: 1.15rem;
            font-weight: 800
        }

        dialog p {
            margin: 6px 0 10px;
            color: var(--soft);
            font-size: .9rem
        }

        dialog p b {
            color: var(--ink);
            text-transform: none
        }

        dialog .err {
            color: var(--imag);
            min-height: 1.3em
        }

        dialog .tools {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 6px
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            max-width: calc(100% - 32px);
            padding: 8px 16px;
            background: var(--card);
            border: 2px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            font-weight: 700;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s
        }

        #toast.show {
            opacity: 1
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap
        }

        @media (prefers-reduced-motion: reduce) {
            .spin {
                animation-duration: 2s
            }
        }
    </style>

}
@media (prefers-reduced-motion: no-preference) {

(function () {
    var orig = window.scrollTo.bind(window);
    window.scrollTo = function (a, b) {
        orig.apply(window, arguments);
        var o = (a && typeof a === 'object') ? a : { left: a, top: b };
        try { document.body.scrollTo({ top: o.top || 0, left: o.left || 0, behavior: o.behavior || 'auto' }); } catch (e) { document.body.scrollTop = o.top || 0; }
    };
})();

    if (document.fonts) { document.fonts.ready.then(fit); document.fonts.addEventListener('loadingdone', fit); document.fonts.load('italic 400 13px "Chakra Petch"').then(fit).catch(function () { }); }
})();
</script>

<script id="gtop-search">
(function () {
    var go = document.getElementById('tgo'), src = document.getElementById('tsearch'); if (!go || !src) return;
    var L = 'en'; try { var s = localStorage.getItem('lang'); if (s === 'es' || s === 'ja' || s === 'zh') L = s; } catch (e) { }
    var T = { en: ['search', 'type here', 'close'], es: ['buscar', 'escribe aquí', 'cerrar'], ja: ['検索', 'ここに入力', '閉じる'], zh: ['搜尋', '在此輸入', '關閉'] }[L];
    var mq = matchMedia('(max-width:600px)');
    var d = document.createElement('dialog'); d.id = 'gsearchdlg'; d.setAttribute('aria-label', T[0]);
    d.innerHTML = '<h3></h3><form class="gsform"><div class="gsrow"><input type="search" autocomplete="off"><button type="submit"></button></div><button type="button" class="gsclose"></button></form>';
    d.querySelector('h3').textContent = T[0]; d.querySelector('button[type=submit]').textContent = T[0]; d.querySelector('.gsclose').textContent = T[2];
    var inp = d.querySelector('input'); inp.placeholder = T[1]; inp.setAttribute('aria-label', T[0]);
    document.body.appendChild(d);
    go.addEventListener('click', function (e) {
        if (!mq.matches) return;
        e.preventDefault(); e.stopImmediatePropagation();
        inp.value = src.value; if (!d.open) d.showModal(); inp.focus(); inp.select();
    }, true);
    d.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();
        src.value = inp.value; src.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); d.close();
    });
    d.querySelector('.gsclose').addEventListener('click', function () { d.close(); });
    d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
    var chg = function () { if (!mq.matches && d.open) d.close(); };
    if (mq.addEventListener) mq.addEventListener('change', chg); else mq.addListener(chg);
})();
</script>
