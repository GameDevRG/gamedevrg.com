<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixel runner</title>
<style>
:root{--bg:#f1efe9;--fg:#1d1d22;--mut:#6b6b75;--btn:#dcd9cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151b;--fg:#e8e8ee;--mut:#8a8a96;--btn:#2a2a33}}
:root[data-theme="dark"]{--bg:#15151b;--fg:#e8e8ee;--mut:#8a8a96;--btn:#2a2a33}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
canvas{touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
.hint{color:var(--mut);text-align:center;padding:0 12px}
.pad{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;touch-action:none}
.pad button{background:var(--btn);color:var(--fg);border:0;border-radius:8px;width:52px;height:44px;font:inherit;font-size:18px;touch-action:none;user-select:none}
</style>
</head>
<body>
<canvas id="c" width="256" height="144"></canvas>
<div class="hint">← → / a d move · mouse aims (move away from it to walk backwards) · space / ↑ / w jump · shift run · j joints · r back to surface · hold t time · l lighting · 1 2 3 / q / wheel pick · axe · sword · click (aim anywhere) or f to swing · i / tab inventory</div>
<div class="pad">
<button data-k="ArrowLeft">◀</button><button data-k="Space">▲</button><button data-k="ArrowRight">▶</button><button data-k="ShiftLeft">»</button><button data-k="KeyT">◐</button><button data-k="KeyF">⚒</button><button data-k="KeyB">💧</button><button data-k="KeyQ">⇄</button><button data-k="KeyI">🎒</button>
</div>
<script>
const W=256,H=144,cv=document.getElementById('c'),ctx=cv.getContext('2d',{willReadFrequently:true});
ctx.imageSmoothingEnabled=false;
function fit(){const pad=document.querySelector('.pad').offsetHeight+70;
 const s=Math.max(1,Math.floor(Math.min(innerWidth/W,(innerHeight-pad)/H)));
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

// ---- true-pixel primitives (integer grid only) ----
let PLIT=false,PLOX=0,PLOY=0; // PLIT: route sprite / flora colours through the lighting system
const px=(x,y,c)=>{if(PLIT)c=litCol(x,y,c);ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),1,1);};
function line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
 const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
 for(;;){px(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
const tline=(a,b,c,d,col)=>{line(a,b,c,d,col);line(a+1,b,c+1,d,col);};
function disc(cx,cy,r,c){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*0.5)px(cx+x,cy+y,c);}

// ---- procedural world: continuous functions, no tile grid ----
// random world every load (?seed=123 to replay one, N = new world)
let SEED=(()=>{try{const q=new URLSearchParams(location.search).get('seed');if(q)return parseInt(q)||[...q].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);}catch(e){}return Math.random()*2147483647|0;})();
const HINT=(document.querySelector('.hint')||{}).textContent;
const hash=(x,y)=>{let h=(x*374761393+y*668265263+1274126177+SEED*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};
const sm=t=>t*t*t*(t*(t*6-15)+10);
function n2(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=sm(x-ix),fy=sm(y-iy);
 const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
 return a+(b-a)*fx+(c-a+(a-b-c+d)*fx)*fy;}
const n1=x=>n2(x,0.37);
// 3-octave fractal noise (0..1, centred on .5) - far less blobby than a single octave
const fbm=(x,y)=>n2(x,y)*0.6+n2(x*2.13+17.3,y*2.13+31.7)*0.28+n2(x*4.37+7.1,y*4.37+3.9)*0.12;
const smt=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
// surface: broad lands + masked mountain ranges + roughness-weighted hills (flat plains stay flat)
const SEA=150,HELL=1650,LAVA=1735,BED=1800; // sea level, underworld top, lava level, bedrock (world is ~1800 deep)
const MEMOS=[],memo=f=>{const m=new Map();MEMOS.push(m);return x=>{let v=m.get(x);if(v===undefined){if(m.size>60000)m.clear();v=f(x);m.set(x,v);}return v;};};
// ---- biomes: 0 forest, 1 desert, 2 snow (thousands of px wide, forest forced around spawn, jagged borders) ----
const bv=memo(x=>0.5+(fbm(x/3000+300,0.5)-0.5)*smt(400,1500,Math.abs(x)));
const bio=memo(x=>{const v=bv(x)+(n1(x/25+77)-0.5)*0.05;return v<0.41?1:v>0.59?2:0;});
// ---- surface: domain-warped continents + meandering ridged mountain ranges + hills + flooded lowlands ----
const rockk=memo(x=>smt(0.73,0.86,n1(x/15+700))); // stone outcrops
const surf=memo(x=>{
 const w=x+(fbm(x/260+11,5.5)-0.5)*180,v=bv(x),des=smt(0.47,0.39,v),sno=smt(0.53,0.61,v),
  cont=(fbm(w/2600,0.37)-0.5)*220,mt=smt(0.5,0.72,fbm(w/2400+50,0.8)),
  rg=1-Math.abs(fbm(w/520+20,2.1)*2-1),rg2=1-Math.abs(fbm(w/170+5,7.7)*2-1),
  peaks=mt*(rg*rg*190+rg2*rg2*50)*(1-0.6*des+0.3*sno),
  rough=smt(0.4,0.62,fbm(w/900+7,1.5)),
  hills=(fbm(w/230+9,3.3)-0.5)*70*(0.2+0.8*rough)*(1-0.5*des),
  detail=(fbm(w/40+3,9.1)-0.5)*9*(0.2+rough),
  basin=smt(0.64,0.78,fbm(w/1300+700,4.4))*75,
  k0=smt(400,1500,Math.abs(x));const bump=(n1(w/8+40)-0.5)*3+(n1(w/23+90)-0.5)*4*(1-0.7*des)+des*Math.sin(w/34+n1(w/160+5)*7)*5;let s=120+cont-peaks+hills+detail+basin+bump+rockk(x)*(1-0.5*des)*6;
 return Math.floor(Math.min(s,SEA-14)*(1-k0)+s*k0);}); // spawn area stays dry
const spawnY=x=>{x=Math.floor(x);return Math.min(surf(x-3),surf(x),surf(x+3));};
// ---- caves: "worm" tunnels. Each 640px cell owns a few drunken-walk tunnels (smooth heading + slowly breathing width), thin cracks and
// flat-floored chambers; sloped tunnels from the surface act as entrances. Worms are carved into chunks after the rock is generated.
const WC=640,WM=new Map();
function walk(R,x,y,th,steps,r0,r1,ent,wig,pull,chs){
 const pts=[],ch=[],n0=R()*500;let dth=0,x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 for(let i=0;i<steps;i++){
  dth=dth*0.92+(R()-0.5)*wig;th+=dth;
  if(!ent||i>40){const hz=Math.cos(th)>=0?0:Math.PI;th-=pull*Math.sin(th-hz);} // drift back toward horizontal
  x+=Math.cos(th)*3;y+=Math.sin(th)*3;
  const r=r0+(r1-r0)*Math.max(0,Math.min(1,(n2(i/40+n0,n0*0.37)-0.5)*2+0.5));
  pts.push(x,y,r);if(chs&&R()<0.011)ch.push(x,y,70+R()*70,34+R()*30);
  if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
 return{pts,ch,ent,big:r0>20,x0:x0-170,x1:x1+170,y0:y0-170,y1:y1+170};}
function worms(cx,cy){const key=cx*4096+cy;let L=WM.get(key);if(L)return L;L=[];let n=0;const R=()=>hash(key*31+(n++),cx*7+cy*13+991);
 if(cy<0){if(R()<0.55){const sx=cx*WC+R()*WC,s=surf(Math.floor(sx));
   if(s<SEA-14&&Math.abs(sx)>120){const dr=R()<0.5,th=dr?0.45+R()*0.3:Math.PI-0.45-R()*0.3;L.push(walk(R,sx,s-8,th,Math.floor(200+R()*90),28,35,true,0.14,0.035,false));}}}
 else{const gx=cx*WC,gy=cy*WC-512,nm=1+(R()<0.8?1:0)+(R()<0.35?1:0),nc=1+(R()<0.6?1:0);
  for(let k=0;k<nm+nc;k++){const x=gx+R()*WC,y=gy+R()*WC,t=R(),o=R(),r0=30+R()*5,e=R();
   if(y<surf(Math.floor(x))+90||y>HELL-130)continue;
   if(k<nm)L.push(walk(R,x,y,(t<0.5?0:Math.PI)+(o-0.5)*0.8,Math.floor(250+e*250),r0,r0+9+R()*12,false,0.2,0.035,true));
   else L.push(walk(R,x,y,t*6.28,Math.floor(300+e*200),5+o*3,9+o*6,false,0.35,0.008,false));}}
 WM.set(key,L);return L;}
function stamp(c,X0,Y0,px,py,rx,ry,flat,colS,mind,ymax){
 const i0=Math.max(0,Math.floor(px-rx-2-X0)),i1=Math.min(31,Math.ceil(px+rx+2-X0)),j0=Math.max(0,Math.floor(py-ry-2-Y0)),j1=Math.min(31,Math.ceil(py+ry+2-Y0),ymax-Y0);
 for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
  const t=c[j*32+i];if(t<=0||t>=20||t===6)continue;
  const dx=(X0+i-px)/rx,dy=(Y0+j-py)/ry,q=dx*dx+dy*dy;
  if(q>1.12||(flat&&dy>0.5)||Y0+j-colS[i]<mind||(colS[i]>SEA-6&&Y0+j<colS[i]+60))continue;
  if(q>0.78&&q+(n2((X0+i)/5,(Y0+j)/5)-0.5)*0.5>1)continue; // ragged walls
  c[j*32+i]=-1;}}
function carve(c,X0,Y0){
 const colS=[];for(let i=0;i<32;i++)colS[i]=surf(X0+i);
 for(let wc=Math.floor(X0/WC)-3;wc<=Math.floor((X0+31)/WC)+3;wc++)for(let wy=-1;wy<=3;wy++)for(const w of worms(wc,wy)){
  if(w.x1<X0||w.x0>X0+31||w.y1<Y0||w.y0>Y0+31)continue;
  const mind=w.ent?-99:10,p=w.pts,ch=w.ch;
  // big tunnels/chambers start narrow near the surface and only open up to full size as they go deeper (cracks stay as-is)
  // (the runner is 31px tall, so tunnels never shrink below a radius of FL = 22: only the extra width above that grows with depth)
  const gk=(x,y)=>w.big?0.12+0.88*smt(25,320,y-surf(Math.floor(x))):1,FL=22;
  for(let k=0;k<p.length;k+=3){const r=p[k+2]>FL?FL+(p[k+2]-FL)*gk(p[k],p[k+1]):p[k+2];if(p[k]<X0-r-2||p[k]>X0+34+r||p[k+1]<Y0-r-2||p[k+1]>Y0+34+r)continue;stamp(c,X0,Y0,p[k],p[k+1],r,r,false,colS,mind,HELL-6);}
  for(let k=0;k<ch.length;k+=4){const g=0.3+0.7*gk(ch[k],ch[k+1]);stamp(c,X0,Y0,ch[k],ch[k+1],ch[k+2]*g,ch[k+3]*g,true,colS,mind,HELL-6);}}
 for(let i=0;i<32;i++){const x=X0+i,g=x>>1,o=x&1,a=hash(g,501)<0.1,b=hash(g,503)<0.1;if(!a&&!b)continue; // stalactites / stalagmites
  const La=2+Math.floor(hash(g,502)*4)-o,Lb=2+Math.floor(hash(g,504)*4)-o;
  for(let j=0;j<32;j++){if(c[j*32+i]!==-1||Y0+j<colS[i]+45||Y0+j>=HELL)continue;
   if(a)for(let k=1;k<=La&&j-k>=0;k++){const t=c[(j-k)*32+i];if(t>0&&t<20){c[j*32+i]=99;break;}}
   if(b&&c[j*32+i]===-1)for(let k=1;k<=Lb&&j+k<32;k++){const t=c[(j+k)*32+i];if(t>0&&t<20){c[j*32+i]=99;break;}}}}
 for(let q=0;q<1024;q++)if(c[q]===99)c[q]=3;}
const cave=(x,y)=>y<BED-3&&fbm(x/180,y/80)<0.58*smt(HELL,HELL+60,y); // the hell cavern (worms stop above it)
// tile ids: 0 sky, -1 cave wall, 1 grass 2 dirt 3 stone 4 copper 5 gold 6 bedrock 7 sand 8 sandstone 9 snow 10 ice 11 iron 12 silver 13 ash 14 hellstone, 20 water, 21 lava
function genTile(x,y,s,B,sl){
 const d=y-s;
 if(d<0)return s>SEA&&y>=SEA?20:0;
 if(y>=BED+Math.floor(n1(x/9)*8))return 6;
 if(y>=HELL&&cave(x,y))return y>=LAVA?21:-1;
 if(y>=HELL)return y>HELL+40&&n2(x/9+900,y/9)>0.8?14:13;
 const sh=s>SEA-10,top=sl>9||rockk(x)>0.3?3:s<-40?9:s<60?3:sh?7:B===1?7:B===2?9:1; // peaks snow-capped, cliffs bare, coasts sandy
 if(d<(top===9?3:4))return top;
 const dD=(40+fbm(x/160,2.2)*90)*(s<80?0.35:1)*(sl>5?0.55:1)*(1+0.5*smt(110,140,s));let m;
 if(d<dD){m=sh&&d<24?7:B===1?(d<26+n1(x/40)*20?7:8):2;if(d>12&&n2(x/22+40,y/22)>0.8)m=3;}
 else{m=d<dD+55&&n2(x/18+90,y/18)>0.78?(B===1?8:2):3;
  if(B===2&&d<500&&n2(x/16+500,y/16)>0.72)m=10;}
 if(m===3){const u=(x+y*0.5)/8; // ore veins, richer with depth
  if(d>20&&d<500&&n2(u+300,y/6)>0.83)m=4;
  else if(d>100&&d<900&&n2(u+600,y/6)>0.85)m=11;
  else if(d>300&&d<1400&&n2(u+900,y/6)>0.86)m=12;
  else if(d>600&&n2(u+1200,y/6)>0.87)m=5;}
 return m;}
// chunked tile cache, filled ahead of the camera a couple of chunks per frame
const CH=new Map(),ED=new Map(),UPX=new Set();
function chunk(cx,cy){const key=cx*128+cy;let c=CH.get(key);if(c)return c;c=new Int8Array(1024);
 for(let i=0;i<32;i++){const x=cx*32+i,s=surf(x),B=bio(x),sl=Math.abs(surf(x+3)-surf(x-3));
  for(let j=0;j<32;j++)c[j*32+i]=genTile(x,cy*32+j-512,s,B,sl);}
 carve(c,cx*32,cy*32-512);const ed=ED.get(key);if(ed)for(const[i,v]of ed)c[i]=v;CH.set(key,c);return c;}
let lcx=1e9,lcy=1e9,lch=null;
function T(x,y){x=Math.floor(x);y=Math.floor(y);if(y<-512)return 0;if(y>=BED+16)return 6;const cx=x>>5,cy=(y+512)>>5;
 if(cx!==lcx||cy!==lcy){lcx=cx;lcy=cy;lch=chunk(cx,cy);}return lch[((y+512)&31)*32+(x&31)];}
function isSolid(x,y){const t=T(x,y);return t>0&&t<20;}
function prefetch(){let b=2;const x0=(camX>>5)-3,x1=((camX+W)>>5)+3,y0=Math.max(0,((camY+512)>>5)-2),y1=Math.min(75,((camY+H+512)>>5)+2);
 for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++)if(!CH.has(cx*128+cy)){chunk(cx,cy);if(--b<=0)return;}
 if(CH.size>700)for(const k of CH.keys())if(Math.abs(Math.floor(k/128)-(camX>>5))>14)CH.delete(k);}
function newWorld(sd){SEED=sd==null?Math.random()*2147483647|0:sd;MEMOS.forEach(m=>m.clear());WM.clear();CH.clear();lcx=1e9;lcy=1e9;PARTS.length=0;ED.clear();toolsReset();P.hp=P.mhp;P.dead=0;P.inv=0;P.top=null;STAIN.clear();BLD.length=0;P.x=0;P.vx=P.vy=0;P.y=spawnY(0);camYf=null;WS.init=false;WTR.length=0;FF.forEach(f=>f.on=false);showSeed();}
let clk='';
const showSeed=()=>{const h=document.querySelector('.hint');if(h&&HINT)h.textContent=HINT+' · n new world · b blood '+(BL.on?'on':'off')+' · seed '+SEED+(clk?' · '+clk:'');};

// ---- input ----
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyJ')joints=!joints;if(e.code==='KeyN')newWorld();if(e.code==='KeyL')lighting=!lighting;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('keydown',e=>{if(e.code==='Tab')e.preventDefault();});
document.querySelectorAll('[data-k]').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[b.dataset.k]=false));});
let joints=false;

// ---- mouse aim ----
const aim={x:W/2,y:H/2,on:false};let camX=0;
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=cv.getBoundingClientRect();setAim(e);aim.on=true;});
// ---- player ----
const HB=31,HIP=13;
const P={x:0,y:spawnY(0),vx:0,vy:0,f:1,hp:100,mhp:100,dead:0,inv:0,flash:0,rg:0,top:null,wg:true,ground:true,p:0,coy:0,buf:0,hold:false,feet:[{x:2,y:0},{x:-2,y:0}],hands:[{x:0,y:8},{x:0,y:8}],sc:null};
const bodyHit=(x,y)=>{for(let k=1;k<HB;k+=2)if(isSolid(x-3,y-k)||isSolid(x+3,y-k))return true;return isSolid(x-3,y-HB+1)||isSolid(x,y-HB+1)||isSolid(x+3,y-HB+1);};
const feet=(x,y)=>isSolid(x-3,y)||isSolid(x,y)||isSolid(x+3,y);
const headHit=(x,y)=>isSolid(x-3,y-HB)||isSolid(x,y-HB)||isSolid(x+3,y-HB);
const PARTS=[];
function dust(x,y,m,n,sp){if(m<=0||m>14)return;const c=PAL[m===1?2:m][0];for(let i=0;i<n;i++)PARTS.push({x:x+(Math.random()-.5)*4,y:y-1,vx:(Math.random()-.5)*sp,vy:-Math.random()*sp*0.7,l:12+Math.random()*10|0,c});}
function stepParts(){for(let q=PARTS.length-1;q>=0;q--){const d=PARTS[q];d.x+=d.vx;d.y+=d.vy;d.vy+=0.1;if(--d.l<=0)PARTS.splice(q,1);}}
// ---- health & blood ----
// Health (100): slimes, long falls and lava hurt; it regenerates slowly after a few quiet seconds. Blood (toggle: b): wounds spray droplets that fly
// ballistically and stain the first solid pixel they hit. Stains dry darker, fade away after STL ticks, and vanish if that pixel is dug out.
// Slimes bleed green gel instead of red.
const BL={on:true,k:false},BLD=[],STAIN=new Map(),STL=2700,FALLD=80; // STL: stain lifetime in ticks (45 s); FALLD: fall distance that starts to hurt
const BC=[[190,22,30],[150,14,22],[214,44,48]],GC=[[95,211,95],[47,138,69],[160,240,150]];
function bleed(x,y,n,dx,dy,sp,gel){if(!BL.on)return;const pal=gel?GC:BC;
 for(let i=0;i<n&&BLD.length<400;i++){const c=pal[i%3],k=sp*(0.4+Math.random()*0.9);
  BLD.push({x,y,vx:dx*k+(Math.random()-.5)*sp*1.1,vy:dy*k-Math.random()*sp*0.8-0.2,rgb:c,c:hex(c[0],c[1],c[2]),l:160});}}
function stain(x,y,rgb,a){if(!isSolid(x,y))return;const key=(x+1e6)*4096+(y+1024),o=STAIN.get(key);
 if(o){o.a=Math.min(0.9,o.a+a*0.6);o.t0=tickN;o.rgb=rgb;}
 else{STAIN.set(key,{x,y,rgb,a,t0:tickN});if(STAIN.size>5000){let n=0;for(const k of STAIN.keys()){STAIN.delete(k);if(++n>500)break;}}}}
function bsplat(x,y,rgb){stain(x,y,rgb,0.85);for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if((i||j)&&Math.random()<0.3)stain(x+i,y+j,rgb,0.6);}
function stepBlood(){for(let q=BLD.length-1;q>=0;q--){const d=BLD[q];d.vy=Math.min(d.vy+0.1,3.5);d.vx*=0.995;
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(d.vx),Math.abs(d.vy)))),sx=d.vx/n,sy=d.vy/n;let end=--d.l<=0;
  for(let i=0;i<n&&!end;i++){const nx=d.x+sx,ny=d.y+sy,t=T(nx,ny);

// ---- light grid: 2px cells pinned to the world; channels per cell: r,g,b (point lights), skylight, direct sun/moon ----

function sweepPass(fwd){

  for(let gx=0;gx<GW;gx++){

const actW=(x,y)=>{if(ACTW.size<8000)ACTW.add((x+1e6)*4096+(y+1024));};
function splash(x,y,v){const n=3+Math.min(8,v*2|0);for(let i=0;i<n;i++)PARTS.push({x:x+(Math.random()-.5)*4,y,vx:(Math.random()-.5)*(1+v*0.5),vy:-(0.8+Math.random()*1.4)*Math.min(2.2,0.6+v*0.35),l:16+Math.random()*12|0,c:i&1?'#a8d4f2':'#6aa7d8'});}
// ---- long-range leveling: a stuck surface pixel scans along the connected free surface (up to 64 columns) and moves to the nearest column
// that is at least 2px lower, then wakes its neighbours so the correction spreads outward like a wave. Open water ends up flat to within 1px.
const LVL=new Set(),wk=(x,y)=>(x+1e6)*4096+(y+1024);
function levelStep(){
 if(tickN%20===0){const x0=Math.floor(P.x)-128; // lazy sweep: re-wake the visible sea surface so sleeping high spots notice lower neighbours
  for(let x=x0;x<x0+256;x+=2){let y=SEA-10;while(y<SEA+30&&T(x,y)!==20)y++;if(y<SEA+30&&T(x,y-1)<=0&&LVL.size<3000)LVL.add(wk(x,y));}}
 if(!LVL.size)return;let n=0;
 for(const k of LVL){if(++n>40)break;LVL.delete(k);
  const x=Math.floor(k/4096)-1e6,y=k%4096-1024;if(T(x,y)!==20||T(x,y-1)>0)continue;
  const f=tickN&1?1:-1;let done=false;
  for(const d of[f,-f]){if(done)break;let xx=x,yy=y;
   for(let m=1;m<=64;m++){xx+=d;let c=0; // follow the free surface column by column: climb while water, descend while air
    if(T(xx,yy)===20){while(T(xx,yy-1)===20&&c++<4)yy--;if(T(xx,yy-1)>=0)break;}
    else if(T(xx,yy)<=0){while(T(xx,yy+1)<=0&&c++<4)yy++;if(T(xx,yy+1)!==20)break;yy++;}
    else break; // a wall or dune: separate pools stay separate
    if(yy>=y+2){setT(xx,yy-1,20);setT(x,y,y<surf(x)?0:-1);actW(xx,yy-1);
     for(let a=-1;a<=1;a++)for(let b=0;b<=1;b++)if(LVL.size<3000)LVL.add(wk(x+a,y+b));
     if(LVL.size<3000)LVL.add(wk(xx,yy-1));done=true;break;}}}}}
function waterStep(){if(!ACTW.size)return;const arr=[...ACTW];ACTW.clear();let n=0;const em=(a,b)=>T(a,b)<=0;
 for(const k of arr){const x=Math.floor(k/4096)-1e6,y=k%4096-1024;if(T(x,y)!==20)continue;if(++n>800){ACTW.add(k);continue;}
  let nx=x,ny=y;
  if(em(x,y+1))ny=y+1;
  else{const d=hash(x,y+tickN)<0.5?1:-1;
   if(em(x+d,y+1)&&em(x+d,y)){nx=x+d;ny=y+1;}
   else if(em(x-d,y+1)&&em(x-d,y)){nx=x-d;ny=y+1;}
   else{let best=0;for(const dd of[d,-d]){for(let m=1;m<=16&&em(x+dd*m,y);m++)if(em(x+dd*m,y+1)){if(!best||m<Math.abs(best))best=dd*m;break;}}
    if(best){nx=x+best;ny=y;}}}
  if(nx===x&&ny===y){if(LVL.size<3000&&T(x,y-1)<=0)LVL.add(k);continue;}
  setT(nx,ny,20);setT(x,y,y<surf(x)?0:-1);actW(nx,ny);}}
function drawActors(cx,cy){PLIT=lighting;PLOX=cx;PLOY=cy;
 for(const b of BODY){litSprite(b.cv,b.W,b.H,b.cxl,b.cyl,b.wx,b.wy,b.th,Math.max(4,b.W/2),Math.max(4,b.H/2),b.wx,b.wy);
  ctx.save();if(b.fo>0)ctx.globalAlpha=b.fo/40;ctx.translate(Math.round(b.wx-cx),Math.round(b.wy-cy));ctx.rotate(b.th);ctx.drawImage(BT,-b.cxl,-b.cyl);ctx.restore();}
 for(const d of DEB){if(d.k==='l'&&d.l<40&&(d.l&2))continue;const X=d.x-cx,Y=d.y-cy;px(X,Y,d.c);if(d.big||d.w>2.5){px(X+1,Y,d.c);px(X,Y+1,d.c);px(X+1,Y+1,d.c);}}
 for(const m of MOB)drawSlime(m,cx,cy);
 PLIT=false;waterWarp(cx,cy);if(INVO.t>0)invBlur();drawFlash();if(INVO.t>0){drawHealth();drawInv();}else drawHud();}

let acc=0,last=performance.now(),camY=0,camYf=null;
function frame(t){
 const dt=Math.min(100,t-last);acc+=dt;last=t;
 {const ik=!!(keys.KeyI||keys.Tab);if(ik&&!INVO.k&&P.dead<=0)INVO.open=!INVO.open;INVO.k=ik;if(keys.Escape&&INVO.open)INVO.open=false;INVO.t=Math.max(0,Math.min(1,INVO.t+(INVO.open?1:-1)/12));}
 if(!INVO.open)TOD=(TOD+dt/1000/DAYLEN*(keys.KeyT?24:1))%1;envUpdate();
 const cs=String(Math.floor(TOD*24)).padStart(2,'0')+':'+String(Math.floor(TOD*1440)%60).padStart(2,'0');if(cs!==clk){clk=cs;showSeed();}
 while(acc>=1000/60){if(!INVO.open)update();acc-=1000/60;}
 camX=Math.round(P.x-W/2);
 const ty=P.y-100;camYf=camYf===null?ty:camYf+(ty-camYf)*0.12;camY=Math.round(camYf);prefetch();
 drawWorld(camX,camY);
 ctx.save();ctx.translate(0,-camY);PLIT=lighting;PLOX=camX;PLOY=0;if(lighting)setObj(P.x,P.y-15,6,16);if(P.dead<=0){if(P.inv>0&&((P.inv>>2)&1))ctx.globalAlpha=0.4;drawPlayer(camX);}else drawRag(camX);OBJ.on=false;PLIT=false;ctx.restore();
 PLIT=lighting;PLOX=camX;PLOY=camY;for(const d of PARTS)px(d.x-camX,d.y-camY,d.c);for(const d of BLD)px(d.x-camX,d.y-camY,d.c);PLIT=false;
 drawActors(camX,camY);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
showSeed();
