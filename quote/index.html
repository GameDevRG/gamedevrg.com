<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f14">
    <title>inspire me</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ovo&display=swap" rel="stylesheet">
    <style>
        /* ---------------------------------------------------------------
           Colours and gradient positions are registered custom properties.
           Browsers can't animate a gradient directly, but they CAN animate
           registered <color> / <percentage> properties, so everything below
           eases smoothly from one palette to the next.
           --------------------------------------------------------------- */
        @property --bg {
            syntax: '<color>';
            inherits: true;
            initial-value: #0f0f14;
        }

        @property --accent {
            syntax: '<color>';
            inherits: true;
            initial-value: rgba(255, 255, 255, 0.25);
        }

        @property --c1 {
            syntax: '<color>';
            inherits: true;
            initial-value: #24324d;
        }

        @property --c2 {
            syntax: '<color>';
            inherits: true;
            initial-value: #1b263b;
        }

        @property --x {
            syntax: '<percentage>';
            inherits: true;
            initial-value: 50%;
        }

        @property --y {
            syntax: '<percentage>';
            inherits: true;
            initial-value: 50%;
        }

        :root {
            --bg: #0f0f14;
            --accent: rgba(255, 255, 255, 0.25);
            --c1: #24324d;
            --c2: #1b263b;
            --x: 50%;
            --y: 50%;
            transition:
                --x 5s cubic-bezier(0.22, 1, 0.36, 1),
                --y 5s cubic-bezier(0.22, 1, 0.36, 1),
                --c1 4s ease,
                --c2 4s ease,
                --bg 3s ease,
                --accent 3s ease;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            background: var(--bg);
            font-family: "Ovo", serif;
            color: white;
            text-align: center;
            /* room for the settings button, and for notches / home bars on phones */
            padding:
                calc(64px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* the gradient layers stay put while the page scrolls */
        #bgGradient,
        #bgGradient2 {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        #bgGradient {
            opacity: 0.12;
            background: radial-gradient(circle at var(--x) var(--y), var(--c1) 0%, var(--c2) 35%, #0f0f14 70%);
        }

        /* a soft second glow that drifts the opposite way */
        #bgGradient2 {
            opacity: 0.6;
            background: radial-gradient(circle at calc(100% - var(--x)) calc(100% - var(--y)), var(--accent) 0%, transparent 55%);
        }

        #container {
            /* margin: auto centres it, and still lets the page scroll if the text is tall */
            margin: auto;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        #output {
            font-size: clamp(1.25rem, 5vw, 1.5rem);
            line-height: 1.45;
            font-style: italic;
            overflow-wrap: anywhere;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 1.5s ease, filter 1.5s ease, color 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin-bottom: 10px;
        }

        #attribution {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-style: normal;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 1.5s ease, filter 1.5s ease, color 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #output.show,
        #attribution.show {
            opacity: 1;
            filter: blur(0);
        }

        button {
            font-family: "Ovo", serif;
            color: #fff;
            font-size: 1rem;
            min-height: 44px;
            /* comfortable tap target */
            padding: 10px 22px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        button:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* hover effects only on devices that actually hover (not stuck after a tap on phones) */
        @media (hover: hover) {
            button:hover {
                background: rgba(255, 255, 255, 0.05);
                transform: translateY(-2px);
            }
        }

        #inspireBtn {
            margin-top: 20px;
            font-size: 1.1rem;
            padding: 12px 30px;
            position: relative;
            z-index: 3;
        }

        #settingsBtn {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            margin: 0;
            padding: 8px 16px;
            z-index: 10;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            -webkit-backdrop-filter: blur(0px);
            backdrop-filter: blur(0px);
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 5;
        }

        #overlay.active {
            background: rgba(0, 0, 0, 0.4);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        /* settings: scrolls on short screens (landscape phones), closes when you tap outside the panel */
        #settingsMenu {
            position: fixed;
            inset: 0;
            display: flex;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
            opacity: 0;
            transform: scale(0.98);
            visibility: hidden;
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0s linear 0.5s;
            z-index: 6;
            pointer-events: none;
            color: white;
            text-align: center;
        }

        #settingsMenu.active {
            opacity: 1;
            transform: scale(1);
            visibility: visible;
            transition-delay: 0s;
            pointer-events: auto;
        }

        .panel {
            margin: auto;
            width: 100%;
            max-width: 420px;
        }

        .panel h2 {
            margin: 0 0 10px;
            font-weight: normal;
        }

        .section {
            margin: 14px 0;
        }

        .section h3 {
            margin: 0 0 8px;
            font-weight: normal;
        }

        .opts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .opts button {
            padding: 8px 16px;
            min-width: 56px;
        }

        .opts button.on {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.55);
        }

        #closeBtn {
            margin-top: 18px;
        }

        @media (prefers-reduced-motion: reduce) {

            :root,
            #output,
            #attribution {
                transition-duration: 0.3s !important;
            }

            #output,
            #attribution {
                filter: none;
            }
        }
    </style>
</head>

<body>

    <div id="bgGradient" aria-hidden="true"></div>
    <div id="bgGradient2" aria-hidden="true"></div>

    <main id="container">
        <div id="output" aria-live="polite"></div>
        <div id="attribution"></div>
        <button id="inspireBtn" type="button">inspire me</button>
    </main>

    <button id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsMenu">settings</button>

    <div id="overlay"></div>

    <div id="settingsMenu" role="dialog" aria-modal="true" aria-label="settings" aria-hidden="true">
        <div class="panel">
            <h2>settings</h2>

            <div class="section">
                <h3>tone</h3>
                <div class="opts" role="group" aria-label="tone">
                    <button type="button" data-tone="default">Warm</button>
                    <button type="button" data-tone="soft">Soft</button>
                    <button type="button" data-tone="dark">Comforting</button>
                </div>
            </div>

            <div class="section">
                <h3>sentence count</h3>
                <div class="opts" role="group" aria-label="sentence count">
                    <button type="button" data-count="1">1</button>
                    <button type="button" data-count="2">2</button>
                    <button type="button" data-count="3">3</button>
                </div>
            </div>

            <button id="closeBtn" type="button">close</button>
        </div>
    </div>


    <script>
        let markov = {};
        let dataFailed = false;
        const attributions = ["-someone", "-unknown", "-anonymous", "-unsigned", "-a stranger", "-unsaid", "-this webpage"];

        let tone = "default";
        let sentenceCount = 1;

        /* x / y: where the gradient glow sits (percent). c1 / c2: its two colours. text / accent: the text colours. */
        const palettes = [
            { x: 20, y: 80, c1: '#3a1f7a', c2: '#2d1b69', text: '#e6d5ff', accent: '#b39eff' },
            { x: 80, y: 20, c1: '#005f4f', c2: '#004d40', text: '#e0f2f1', accent: '#80cbc4' },
            { x: 40, y: 40, c1: '#7a5a00', c2: '#664d00', text: '#fff3e0', accent: '#ffb74d' },
            { x: 60, y: 60, c1: '#4a7a00', c2: '#336600', text: '#e8f5e8', accent: '#aed581' },
            { x: 30, y: 70, c1: '#7a003d', c2: '#660033', text: '#fce4ec', accent: '#f48fb1' },
            { x: 70, y: 30, c1: '#00407a', c2: '#003366', text: '#e1f5fe', accent: '#4fc3f7' },
            { x: 50, y: 10, c1: '#7a3d00', c2: '#663300', text: '#fff8e1', accent: '#ffa726' },
            { x: 10, y: 50, c1: '#24324d', c2: '#1b263b', text: '#f0f4f8', accent: '#778da9' }
        ];

        let currentPaletteIndex = -1;

        const $ = id => document.getElementById(id);
        const root = document.documentElement;

        /* ---------- data ---------- */

        async function loadData() {
            try {
                const res = await fetch("data.txt");
                if (!res.ok) throw new Error(res.status);
                buildMarkov(await res.text());
            } catch (e) {
                dataFailed = true;
            }
        }

        function buildMarkov(text) {
            const words = text.split(/\s+/).filter(Boolean);

            for (let i = 0; i < words.length - 1; i++) {
                const word = words[i];
                const next = words[i + 1];

                if (!markov[word]) {
                    markov[word] = [];
                }

                markov[word].push(next);
            }
        }

        /* ---------- colours ---------- */

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function darkenHex(hex, factor = 0.2) {
            const r = Math.floor(parseInt(hex.slice(1, 3), 16) * factor);
            const g = Math.floor(parseInt(hex.slice(3, 5), 16) * factor);
            const b = Math.floor(parseInt(hex.slice(5, 7), 16) * factor);

            return `rgb(${r}, ${g}, ${b})`;
        }

        function getNextPalette() {
            currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
            return palettes[currentPaletteIndex];
        }

        /* setting these starts the smooth transitions declared on :root */
        function applyPalette(p) {
            root.style.setProperty('--x', p.x + '%');
            root.style.setProperty('--y', p.y + '%');
            root.style.setProperty('--c1', p.c1);
            root.style.setProperty('--c2', p.c2);
            root.style.setProperty('--bg', darkenHex(p.accent, 0.18));
            root.style.setProperty('--accent', hexToRgba(p.accent, 0.25));
        }

        /* ---------- text ---------- */

        function makeQuote() {
            const keys = Object.keys(markov);
            if (!keys.length) return null;

            let word = keys[Math.floor(Math.random() * keys.length)];
            let result = [word];
            let sentences = 0;

            while (sentences < sentenceCount && result.length < 80) {
                const nextWords = markov[word];
                if (!nextWords) break;

                let options = nextWords;

                if (tone === "soft") {
                    options = nextWords.filter(w => !/[!?]/.test(w));
                }

                word = options[Math.floor(Math.random() * options.length)] || nextWords[0];
                result.push(word);

                if (word.endsWith(".") || word.endsWith("!") || word.endsWith("?")) {
                    sentences++;
                }
            }

            return `"${result.join(" ")}"`;
        }

        let timers = [];
        const later = (fn, ms) => timers.push(setTimeout(fn, ms));

        function generateText() {
            const output = $("output");
            const attribution = $("attribution");

            /* a new click cancels anything still on its way, so old text can't pop in late */
            timers.forEach(clearTimeout);
            timers = [];

            const hadText = output.textContent !== '';
            const nextPalette = getNextPalette();

            /* start everything moving at once: background, glow position, and the old text's colour,
               while the old text fades out */
            applyPalette(nextPalette);
            output.style.color = nextPalette.text;
            attribution.style.color = nextPalette.accent;
            output.classList.remove("show");
            attribution.classList.remove("show");

            later(() => {
                const quote = makeQuote();
                output.textContent = quote || (dataFailed ? "(couldn't load data.txt)" : "(still loading, try again in a moment)");
                attribution.textContent = quote ? attributions[Math.floor(Math.random() * attributions.length)] : '';

                later(() => {
                    output.classList.add("show");
                    later(() => attribution.classList.add("show"), 200);
                }, 50);
            }, hadText ? 1300 : 250);
        }

        /* ---------- settings ---------- */

        function setSettings(open) {
            $("overlay").classList.toggle("active", open);
            $("settingsMenu").classList.toggle("active", open);
            $("settingsMenu").setAttribute("aria-hidden", String(!open));
            $("settingsBtn").setAttribute("aria-expanded", String(open));
            if (open) $("closeBtn").focus(); else $("settingsBtn").focus();
        }
        const settingsOpen = () => $("settingsMenu").classList.contains("active");

        function setTone(newTone) {
            tone = newTone;
            syncOptions();
        }

        function setSentenceCount(n) {
            sentenceCount = n;
            syncOptions();
        }

        /* highlight the chosen options */
        function syncOptions() {
            document.querySelectorAll("[data-tone]").forEach(b => {
                const on = b.dataset.tone === tone;
                b.classList.toggle("on", on);
                b.setAttribute("aria-pressed", String(on));
            });
            document.querySelectorAll("[data-count]").forEach(b => {
                const on = +b.dataset.count === sentenceCount;
                b.classList.toggle("on", on);
                b.setAttribute("aria-pressed", String(on));
            });
        }

        $("inspireBtn").addEventListener("click", generateText);
        $("settingsBtn").addEventListener("click", () => setSettings(!settingsOpen()));
        $("closeBtn").addEventListener("click", () => setSettings(false));
        $("overlay").addEventListener("click", () => setSettings(false));
        /* the settings layer sits above the overlay, so tapping the empty space around the panel closes it too */
        $("settingsMenu").addEventListener("click", e => { if (e.target === $("settingsMenu")) setSettings(false); });
        document.addEventListener("keydown", e => { if (e.key === "Escape" && settingsOpen()) setSettings(false); });
        document.querySelectorAll("[data-tone]").forEach(b => b.addEventListener("click", () => setTone(b.dataset.tone)));
        document.querySelectorAll("[data-count]").forEach(b => b.addEventListener("click", () => setSentenceCount(+b.dataset.count)));

        syncOptions();
        loadData();
    </script>
</body>

</html>
