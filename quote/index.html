<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>inspire me</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ovo&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            font-family: "Ovo", serif;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }


        :root {
            --bg: #0f0f14;
        }


        #container {
            max-width: 600px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        #bgGradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.12;
            transition: all 5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }

        #output {
            font-size: 1.5rem;
            font-style: italic;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 1.5s ease, filter 1.5s ease, color 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin-bottom: 10px;
        }

        #output.show {
            opacity: 1;
            filter: blur(0);
        }

        #attribution {
            font-size: 1.2rem;
            font-style: normal;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 1.5s ease, filter 1.5s ease, color 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #attribution.show {
            opacity: 1;
            filter: blur(0);
        }


        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: 1px solid var(--accent);
            background: rgba(255, 255, 255, 0);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            z-index: 3;
            backdrop-filter: blur(20px);
            font-family: "Ovo", serif;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        #bgGradient,
        #bgGradient2 {
            position: absolute;
            inset: 0;
            opacity: 0.12;
            transition: all 5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }

        #settingsBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            border: 1px solid var(--accent);
            background: rgba(255, 255, 255, 0);
            backdrop-filter: blur(20px);
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 5;
        }

        #overlay.active {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        #settingsMenu {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.5s ease;
            z-index: 6;
            pointer-events: none;
            color: white;
            text-align: center;
        }

        #settingsMenu.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        #settingsMenu h2 {
            margin-bottom: 10px;
        }

        .section {
            margin: 10px 0;
        }

        .section button {
            margin: 5px;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            border: 1px solid var(--accent);
            background: rgba(255, 255, 255, 0);
            backdrop-filter: blur(20px);
        }


        .ovo-regular {
            font-family: "Ovo", serif;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>

<body>

    <div id="bgGradient"></div>
    <div id="bgGradient2"></div>
    <div id="container">
        <div id="output"></div>
        <div id="attribution"></div>
        <button onclick="generateText()">inspire me</button>
    </div>
    <button id="settingsBtn" onclick="toggleSettings()">settings</button>

    <div id="overlay" onclick="toggleSettings()"></div>

    <div id="settingsMenu">
        <h2 style="font-weight: normal;">settings</h2>

        <div class="section">
            <h3 style="font-weight: normal;">tone</h3>
            <button onclick="setTone('default')">Warm</button>
            <button onclick="setTone('soft')">Soft</button>
            <button onclick="setTone('dark')">Comforting</button>
        </div>


        <div class="section">
            <h3 style="font-weight: normal;">sentence count</h3>
            <button onclick="setSentenceCount(1)">1</button>
            <button onclick="setSentenceCount(2)">2</button>
            <button onclick="setSentenceCount(3)">3</button>
        </div>
    </div>


    <script>
        let markov = {};
        const attributions = ["-someone", "-unknown", "-anonymous", "-unsigned", "-a stranger", "-unsaid", "-this webpage"];

        let tone = "default";
        let sentenceCount = 1;


        const palettes = [
            { bg: 'radial-gradient(circle at 20% 80%, #3a1f7a 0%, #2d1b69 35%, #0f0f14 70%)', text: '#e6d5ff', accent: '#b39eff' },
            { bg: 'radial-gradient(circle at 80% 20%, #005f4f 0%, #004d40 35%, #0f0f14 70%)', text: '#e0f2f1', accent: '#80cbc4' },
            { bg: 'radial-gradient(circle at 40% 40%, #7a5a00 0%, #664d00 35%, #0f0f14 70%)', text: '#fff3e0', accent: '#ffb74d' },
            { bg: 'radial-gradient(circle at 60% 60%, #4a7a00 0%, #336600 35%, #0f0f14 70%)', text: '#e8f5e8', accent: '#aed581' },
            { bg: 'radial-gradient(circle at 30% 70%, #7a003d 0%, #660033 35%, #0f0f14 70%)', text: '#fce4ec', accent: '#f48fb1' },
            { bg: 'radial-gradient(circle at 70% 30%, #00407a 0%, #003366 35%, #0f0f14 70%)', text: '#e1f5fe', accent: '#4fc3f7' },
            { bg: 'radial-gradient(circle at 50% 10%, #7a3d00 0%, #663300 35%, #0f0f14 70%)', text: '#fff8e1', accent: '#ffa726' },
            { bg: 'radial-gradient(circle at 10% 50%, #24324d 0%, #1b263b 35%, #0f0f14 70%)', text: '#f0f4f8', accent: '#778da9' }
        ];



        let currentPaletteIndex = -1;

        async function loadData() {
            const res = await fetch("data.txt");
            const text = await res.text();
            buildMarkov(text);
        }

        function buildMarkov(text) {
            const words = text.split(/\s+/);

            for (let i = 0; i < words.length - 1; i++) {
                const word = words[i];
                const next = words[i + 1];

                if (!markov[word]) {
                    markov[word] = [];
                }

                markov[word].push(next);
            }
        }



        function getNextPalette() {
            currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
            return palettes[currentPaletteIndex];
        }

        function generateText() {
            const output = document.getElementById("output");
            const attribution = document.getElementById("attribution");
            const bgGradient = document.getElementById("bgGradient");

            output.classList.remove("show");
            attribution.classList.remove("show");

            const keys = Object.keys(markov);
            let word = keys[Math.floor(Math.random() * keys.length)];
            let result = [word];

            let sentences = 0;

            while (sentences < sentenceCount && result.length < 80) {
                const nextWords = markov[word];
                if (!nextWords) break;

                let options = nextWords;

                if (tone === "soft") {
                    options = nextWords.filter(w => !/[!?]/.test(w));
                }

                word = options[Math.floor(Math.random() * options.length)] || nextWords[0];
                result.push(word);

                if (word.endsWith(".") || word.endsWith("!") || word.endsWith("?")) {
                    sentences++;

                }
            }


            const nextPalette = getNextPalette();
            document.documentElement.style.setProperty(
                '--bg',
                darkenHex(nextPalette.accent, 0.18)
            );


            document.documentElement.style.setProperty(
                '--accent',
                hexToRgba(nextPalette.accent, 0.25)
            );


            output.textContent = '';
            attribution.textContent = '';

            bgGradient.style.background = nextPalette.bg;

            setTimeout(() => {
                output.textContent = `"${result.join(" ")}"`;
                output.style.color = nextPalette.text;

                const randomAttribution = attributions[Math.floor(Math.random() * attributions.length)];
                attribution.textContent = randomAttribution;
                attribution.style.color = nextPalette.accent;

                setTimeout(() => {
                    output.classList.add("show");

                    setTimeout(() => {
                        attribution.classList.add("show");
                    }, 200);
                }, 50);
            }, 1200);
        }

        loadData();
        function toggleSettings() {
            document.getElementById("overlay").classList.toggle("active");
            document.getElementById("settingsMenu").classList.toggle("active");

        }
// jews
        function setTone(newTone) {

            tone = newTone;
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function darkenHex(hex, factor = 0.4) {
            const r = Math.floor(parseInt(hex.slice(1, 3), 16) * factor);
            const g = Math.floor(parseInt(hex.slice(3, 5), 16) * factor);
            const b = Math.floor(parseInt(hex.slice(5, 7), 16) * factor);

            return `rgb(${r}, ${g}, ${b})`;
        }
        function darkenHex(hex, factor = 0.2) {
            const r = Math.floor(parseInt(hex.slice(1, 3), 16) * factor);
            const g = Math.floor(parseInt(hex.slice(3, 5), 16) * factor);
            const b = Math.floor(parseInt(hex.slice(5, 7), 16) * factor);

            return `rgb(${r}, ${g}, ${b})`;
        }



    </script>
</body>

</html>
