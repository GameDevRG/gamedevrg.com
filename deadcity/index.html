 const BK=[],ROADS=[],AVW=new Uint8Array(N*N),CN={},ZG=new Uint8Array(N*N),ZC='dmurkicp',DF=new Set(),PL={}; // G: 0 road,1 wall,2 car,3 grass,4 sidewalk,5 door,6 floor. RT bits: 1 horiz road,2 vert road,4 centre line,8 line on tile edge

 /* ---- 1. districts ---- */
 const DCX=(N>>1)+r(-6,6),DCY=(N>>1)+r(-6,6),sd=[{z:'d',x:DCX,y:DCY,w:1.55}];
 {const a0=rng()*6.283,nmid=Math.round(4*CS*1.5);for(let i=0;i<nmid;i++){const a=a0+i*6.283/nmid+(rng()-.5)*.6,d=r(Math.round(19*CS),Math.round(25*CS));sd.push({z:'m',x:DCX+Math.cos(a)*d,y:DCY+Math.sin(a)*d,w:.95})}
  const kinds=(()=>{const kb=['i','r','u','p','r','c','u','r','k','u','m','k','p','r'],o=[];for(let q=Math.round(CS*CS*1.1);q>0;q--)o.push(...kb);return o.sort(()=>rng()-.5)})(),a1=rng()*6.283,DR={i:[36,44],r:[40,48],u:[22,32],p:[26,40],c:[26,34],k:[24,34]},WT={i:1,r:.85,u:1,p:.5,c:.6,k:.7};

 { // main boulevards cross in downtown; the east and west halves may jog
  const wX=pk([5,7,7]),px=DCX-(wX>>1);carve(1,px,wX,2,N-2,wX>5);

  for(const o of LP){const sx=W/2+(o.x-P.x)*zm,sy=H/2+(o.y-P.y)*zm;if(sx<-150||sx>W+150||sy<-150||sy>H+150)continue;const q_=o.t==='pole'?130:o.t==='vend'?50:0;if(!q_)continue;const g2=lx.createRadialGradient(sx,sy,2,sx,sy,q_*zm);g2.addColorStop(0,'rgba(0,0,0,.85)');g2.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g2;lx.beginPath();lx.arc(sx,sy,q_*zm,0,6.3);lx.fill()}
  B.forEach((b,i)=>{if(b.k==='house'||b.k==='church')return;const sx=W/2+(b.d.x-P.x)*zm,sy=H/2+(b.d.y+TS*.8-P.y)*zm;if(sx<-120||sx>W+120||sy<-120||sy>H+120)return;const g2=lx.createRadialGradient(sx,sy,2,sx,sy,90*zm);g2.addColorStop(0,'rgba(0,0,0,.7)');g2.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g2;lx.beginPath();lx.arc(sx,sy,90*zm,0,6.3);lx.fill()});
  c.drawImage(lc,0,0,W,H);c.save();c.globalCompositeOperation='lighter';
  for(const o of LP){const sx=W/2+(o.x-P.x)*zm,sy=H/2+(o.y-P.y)*zm;if(sx<-150||sx>W+150||sy<-150||sy>H+150)continue;if(o.t!=='pole'&&o.t!=='vend')continue;const rd=(o.t==='pole'?110:40)*zm,g2=c.createRadialGradient(sx,sy,2,sx,sy,rd);g2.addColorStop(0,o.t==='pole'?'rgba(255,190,110,.22)':'rgba(120,200,255,.3)');g2.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g2;c.beginPath();c.arc(sx,sy,rd,0,6.3);c.fill()}
  for(const k of CARS){if(k.fate!=='burnt')continue;const sx=W/2+(k.x+k.w/2-P.x)*zm,sy=H/2+(k.y+k.h/2-P.y)*zm;if(sx<-150||sx>W+150||sy<-150||sy>H+150)continue;const rd=(90+10*Math.sin(performance.now()/110+k.x))*zm,g2=c.createRadialGradient(sx,sy,2,sx,sy,rd);g2.addColorStop(0,'rgba(255,130,40,.3)');g2.addColorStop(1,'rgba(0,0,0,.0)');c.fillStyle=g2;c.beginPath();c.arc(sx,sy,rd,0,6.3);c.fill()}
  B.forEach((b,i)=>{if(b.k==='house'||b.k==='church')return;const sx=W/2+(b.d.x-P.x)*zm,sy=H/2+(b.d.y+TS*.8-P.y)*zm;if(sx<-120||sx>W+120||sy<-120||sy>H+120)return;const g2=c.createRadialGradient(sx,sy,2,sx,sy,90*zm);g2.addColorStop(0,`rgba(${NEONG[i%5]},.2)`);g2.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g2;c.beginPath();c.arc(sx,sy,90*zm,0,6.3);c.fill()});c.restore()}
 {const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');c.fillStyle=g;c.fillRect(0,0,W,H)}
 bloom();hurtBlur();
 if(P.flash>0||P.hp<35){const a=Math.max(P.flash>0?P.flash:0,P.hp<35?.35*(1-P.hp/35):0),g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(150,0,0,0)');g.addColorStop(1,`rgba(150,0,0,${Math.min(.8,a*1.6)})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(S.fd>0){c.fillStyle=`rgba(0,0,0,${S.fd/.3*.75})`;c.fillRect(0,0,W,H)}

/* ---------- minimap: follows you; M (or tap it) shows the whole city ---------- */
let MMF=false;
function toggleMM(){MMF=!MMF;const s=MMF?Math.min(340,innerWidth*.6|0,innerHeight*.6|0):132;mm.width=mm.height=s;mm.style.width=mm.style.height=s+'px';mmT=0}
function drawMM(cf){const S_=mm.width,V=MMF?N*TS:1700,k=S_/V,ox=MMF?0:P.x-V/2,oy=MMF?0:P.y-V/2,X=x=>(x-ox)*k,Y=y=>(y-oy)*k;
 mx.clearRect(0,0,S_,S_);mx.fillStyle='#05080a';mx.fillRect(0,0,S_,S_);mx.drawImage(mini,X(0),Y(0),N*TS*k,N*TS*k);
 if(INF){const Rm=infR()*k;mx.save();mx.beginPath();for(const e of INF.eps){mx.moveTo(X(e.x)+Rm,Y(e.y));mx.arc(X(e.x),Y(e.y),Rm,0,6.3)}mx.fillStyle='rgba(200,50,70,.28)';mx.fill();mx.strokeStyle='rgba(235,90,100,.7)';mx.lineWidth=1;mx.stroke();mx.restore()}
 if(HOME){mx.fillStyle='#7fc97a';const hx=Math.max(3,Math.min(S_-3,X(HOME.x))),hy=Math.max(3,Math.min(S_-3,Y(HOME.y)));mx.fillRect(hx-2.5,hy-2.5,5,5)} // stays on the edge when home is off the map window
 if(!MMF)for(const z of Z)if(z.f===cf&&Math.hypot(z.x-P.x,z.y-P.y)<420){mx.fillStyle='#e55';mx.fillRect(X(z.x)-1,Y(z.y)-1,2,2)}
 for(const h of HM)if(!h.dead&&(MMF?h.ally:h.f===cf&&(h.ally||h.vs||Math.hypot(h.x-P.x,h.y-P.y)<300))){mx.fillStyle=h.host?'#ff9a3c':h.ally?'#e0ab4a':'#e6ebe7';mx.fillRect(X(h.x)-1.5,Y(h.y)-1.5,3,3)}
 mx.fillStyle='#6fb6e8';mx.beginPath();mx.arc(X(P.x),Y(P.y),3,0,6.3);mx.fill()}
mm.addEventListener('pointerdown',toggleMM);

/* ---------- hud ---------- */
const BARS=[['health','#ef6a5e'],['hunger','#e0ab4a'],['thirst','#6fb6e8'],['stamina','#7fc97a']],SL=[['\u270a',''],['\ud83c\udfcf',''],['\ud83d\udd2b',''],['\ud83e\ude79',''],['\ud83e\udd6b',''],['\ud83d\udca7','']];
$('#hud').innerHTML=BARS.map((b,i)=>`<div class="b">${b[0]}<u><i id="b${i}" style="background:${b[1]}"></i></u></div>`).join('');
$('#hb').innerHTML=[...Array(HOT)].map((_,i)=>`<div class="s" data-i="${i}"><b>${i+1}</b><span class="si"></span><u class="du"><i></i></u><em></em></div>`).join('')+'<div class="s" data-bag="1"><b>i</b><span class="si">🎒</span></div>';
const slots=[...document.querySelectorAll('.s')];
function hud(){
 if(TK&&(hudN=(hudN||0)+1)%10===0)renderTK();
 [P.hp,P.hu,P.th,P.st].forEach((v,i)=>$('#b'+i).style.width=Math.max(0,v)+'%');
 const ph=S.ph,hr=(6+ph*24)%24,I=P.inv;
 const tp=`<span class="chip">day <b>${Math.min(S.day,WIN)}</b>/${WIN} &middot; <b>${String(Math.floor(hr)).padStart(2,'0')}:${String(Math.floor(hr%1*60)).padStart(2,'0')}</b></span><span class="chip">rescue in <b>${fmt(Math.max(0,WIN*DAY-S.t-.15*DAY))}</b></span><span class="chip">${ZNAME[CITY.zc[CITY.zones[Math.min(N-1,P.y/TS|0)*N+Math.min(N-1,P.x/TS|0)]]]}</span><span class="chip">kills <b>${S.kills}</b></span>${P.car?`<span class="chip">car <b>${Math.max(0,P.car.hp)|0}%</b> &middot; ${Math.abs(P.cv)*.11|0} km/h</span>`:''}<span class="chip">survivors <b>${HM.filter(h=>!h.dead).length}</b>${HM.some(h=>h.ally&&!h.dead)?` &middot; allies <b>${HM.filter(h=>h.ally&&!h.dead).length}</b>`:''}</span>`+(P.bi>=0?`<span class="chip">${B[P.bi].k} &middot; floor <b>${P.f+1}</b>/${B[P.bi].F}</span>`:'')+(P.bleed?'<span class="chip w">bleeding</span>':'')+(P.ex?'<span class="chip w">exhausted</span>':'')+(P.hu<=0?'<span class="chip w">starving</span>':'')+(P.th<=0?'<span class="chip w">dehydrated</span>':'')+infChip();if(tp!==hudS){hudS=tp;$('#top').innerHTML=tp}
 for(let i=0;i<HOT;i++){const e=slots[i],s=P.items[i],D=s&&IT[s.id];e.className='s'+(i===P.eq?' on':'')+(s?'':' no');e.children[1].textContent=s?D.e:'';e.lastChild.textContent=s?(s.id==='gun'?cnt('ammo'):s.n>1?s.n:''):'';
  const du=e.querySelector('.du');if(s&&s.d!=null){const f=Math.min(1,Math.max(0,s.d)/BATMAX);du.style.display='block';du.firstChild.style.width=f*100+'%';du.firstChild.style.background=`hsl(${f*120},100%,45%)`}else du.style.display='none'}
 if(CTO&&(P.car||CTO.f!==P.f||CTO.bi!==P.bi||Math.hypot(CTO.x-P.x,CTO.y-P.y)>80))closeCt();
 if(INVO){const sg=JSON.stringify([P.items,P.eq,SEL,CTO&&CTO.items,HELD]);if(sg!==invS){invS=sg;invR()}}
}

/* ---------- input / setup ---------- */
function resize(){W=innerWidth;H=innerHeight;for(const e of[cv,lc]){e.width=W*DPR;e.height=H*DPR}}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(k===' '||k==='tab')e.preventDefault();if(!live||S.over||document.activeElement.id==='sd')return;
 if(k==='escape'&&INVO&&!paused){toggleInv();return}if(k==='p'||k==='escape'){if(paused){paused=false;scr('')}else{paused=true;scr('<h1>paused</h1><button class="pri" id="rs">resume</button>')}}
 if(paused)return;if(k>='1'&&k<='6')pick(+k-1);if(k==='0')P.eq=-1;if(k==='i'||k==='tab')toggleInv();if(k==='e')interact();if(k==='f')smashKey();if(k==='m')toggleMM();if(k==='q')stairs(-1);if(k==='b'){blood=!blood;toast('blood: '+(blood?'on':'off'))}});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);addEventListener('blur',()=>{for(const k in K)K[k]=0;md=false});

document.addEventListener('click',e=>{const id=e.target.id;if(id==='go')start($('#sd')?$('#sd').value.trim():'',$('#im')?$('#im').value:INFMODE);if(id==='rs'){paused=false;scr('')}});

const tj=$('#tj'),kn=tj.firstElementChild;let tjid=null;
function mvj(e){const r=tj.getBoundingClientRect(),dx=e.clientX-r.left-60,dy=e.clientY-r.top-60,l=Math.hypot(dx,dy)||1,k=Math.min(1,l/45);tjx=dx/l*k;tjy=dy/l*k;kn.style.transform=`translate(${tjx*40}px,${tjy*40}px)`}
tj.addEventListener('pointerdown',e=>{tjid=e.pointerId;tj.setPointerCapture(tjid);mvj(e)});

function loop(t){const raw=(t-last)/1000||0,dt=Math.min(.05,raw);last=t;
 if(P&&!paused&&raw>0&&raw<.5){emaDt+=(raw-emaDt)*.05;if(emaDt>.027&&DPR>1){slowT+=raw;if(slowT>2){DPR=Math.max(1,DPR-.5);slowT=0;emaDt=.016;resize()}}else slowT=Math.max(0,slowT-raw)} // too slow: render at a lower resolution
 if(P&&!paused){upd(dt);hudT-=dt;if(hudT<=0){hudT=.1;hud()}}draw();requestAnimationFrame(loop)}
