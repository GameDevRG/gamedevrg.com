<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>gamedevrg drawings</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Roboto:wght@400;500&display=swap">
  <style>
    :root {
      --sh: 0 2px 6px 2px rgba(60, 64, 67, .3);
      --bg: #f9fbfd;
      --bar: #edf2fa;
      --cv: #f1f3f4;
      --tx: #1f1f1f;
      --mut: #5f6368;
      --bd: #dadce0;
      --hv: #dfe3ea;
      --ac: #3b82f6;
      --pop: #fff;
      --on: #dbeafe;
      --onx: #1e3a8a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --sh: 0 4px 14px rgba(0, 0, 0, .55);
        --bg: #1b1b1b;
        --bar: #2b2d31;
        --cv: #202124;
        --tx: #e3e3e3;
        --mut: #9aa0a6;
        --bd: #3c4043;
        --hv: #3b3d42;
        --ac: #3b82f6;
        --pop: #2b2d31;
        --on: #1e3a6e;
        --onx: #dbeafe
      }
    }

    :root[data-theme="dark"] {
      --sh: 0 4px 14px rgba(0, 0, 0, .55);
      --bg: #1b1b1b;
      --bar: #2b2d31;
      --cv: #202124;
      --tx: #e3e3e3;
      --mut: #9aa0a6;
      --bd: #3c4043;
      --hv: #3b3d42;
      --ac: #3b82f6;
      --pop: #2b2d31;
      --on: #1e3a6e;
      --onx: #dbeafe
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font: 14px Chakra Petch, Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none
    }

    #top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px 0 12px
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #f4b400;
      display: grid;
      place-items: center
    }

    #title {
      font: 18px Chakra Petch, Roboto, Arial;
      border: 1px solid transparent;
      border-radius: 4px;
      background: none;
      color: var(--tx);
      padding: 1px 6px;
      width: 220px
    }

    #title:hover {
      border-color: var(--bd)
    }

    #title:focus {
      outline: 2px solid var(--ac);
      border-color: transparent
    }

    #menus {
      display: flex;
      gap: 0
    }

    .mb {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer
    }

    .mb:hover,
    .mb.on {
      background: var(--hv)
    }

    .sp {
      flex: 1
    }

    .share {
      background: #c2e7ff;
      color: #001d35;
      border-radius: 20px;
      padding: 9px 22px;
      font-weight: 500
    }

    .av {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #a142f4;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 500
    }

    #tb {
      display: flex;
      align-items: center;
      gap: 2px;
      margin: 6px 16px 8px;
      padding: 3px 8px;
      background: var(--bar);
      border-radius: 24px;
      height: 40px;
      overflow-x: auto;
      white-space: nowrap
    }

    .b {
      min-width: 30px;
      height: 30px;
      border: 0;
      border-radius: 4px;
      background: none;
      color: var(--tx);
      cursor: pointer;
      display: grid;
      place-items: center;
      font: 500 14px Chakra Petch, Roboto, Arial;
      padding: 0 5px
    }

    .b:hover {
      background: var(--hv)
    }

    .b.on {
      background: var(--on);
      color: var(--onx)
    }

    .b:disabled {
      opacity: .35;
      cursor: default
    }

    .b svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .v {
      width: 1px;
      height: 20px;
      background: var(--bd);
      margin: 0 6px
    }

    select {
      background: none;
      color: var(--tx);
      border: 0;
      font: 13px Chakra Petch, Roboto;
      height: 30px;
      border-radius: 4px;
      cursor: pointer
    }

    select:hover {
      background: var(--hv)
    }

    select option {
      background: var(--pop)
    }

    .cb {
      position: relative
    }

    .cb input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer
    }

    .sw {
      width: 18px;
      height: 4px;
      margin-top: 3px;
      border-radius: 1px
    }

    #wrap {
      flex: 1;
      position: relative;
      background: var(--cv);
      overflow: hidden;
      touch-action: none
    }

    #cv {
      width: 100%;
      height: 100%;
      display: block
    }

    #ed {
      position: absolute;
      display: none;
      border: 0;
      outline: none;
      caret-color: #000;
      background: transparent;
      resize: none;
      overflow: hidden;
      padding: 0;
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.2;
      z-index: 5
    }

    .pop {
      position: fixed;
      background: var(--pop);
      border-radius: 8px;
      box-shadow: var(--sh);
      padding: 6px 0;
      z-index: 20;
      min-width: 200px
    }

    .pop .it {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 13px
    }

    .pop .it:hover {
      background: var(--hv)
    }

    .pop .it i {
      color: var(--mut);
      font-style: normal
    }

    .pop .sep {
      height: 1px;
      background: var(--bd);
      margin: 5px 0
    }

    .sg {
      display: grid;
      grid-template-columns: repeat(12, 32px);
      padding: 0 8px 4px
    }

    .sg .b {
      height: 32px
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--bd)
    }

    .tabs span {
      flex: 1;
      text-align: center;
      padding: 12px 0 10px;
      font-weight: 500;
      color: var(--mut);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px
    }

    .tabs span.on {
      color: var(--tx);
      border-color: var(--ac)
    }

    .gg {
      display: grid;
      grid-template-columns: repeat(7, 32px);
      gap: 5px 7px;
      margin-top: 8px
    }

    .gs {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, .15)
    }

    .gs:hover {
      outline: 2px solid var(--ac)
    }

    #cdlg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      display: grid;
      place-items: center;
      z-index: 40
    }

    #cdlg .card {
      background: var(--pop);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      color: var(--tx)
    }

    #cdlg h3 {
      margin: 0 0 14px;
      font: 400 22px Chakra Petch, Roboto, Arial
    }

    #cdlg button {
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 8px 18px;
      background: none;
      color: var(--ac);
      cursor: pointer;
      font: 500 14px Chakra Petch, Roboto, Arial
    }

    #cdlg .pri {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6
    }

    #cdlg .row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px
    }

    .cv1 {
      position: relative;
      height: 200px;
      border-radius: 4px;
      cursor: crosshair;
      touch-action: none
    }

    .cv1 i,
    .sl i {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, .6);
      transform: translate(-50%, -50%);
      pointer-events: none
    }

    .sl i {
      top: 50%
    }

    .sl {
      position: relative;
      height: 14px;
      border-radius: 7px;
      margin: 10px 0;
      touch-action: none
    }

    .hue {
      background: linear-gradient(90deg, red, #ff0, #0f0, #0ff, #00f, #f0f, red)
    }

    .ins {
      display: flex;
      gap: 8px;
      margin-top: 14px
    }

    .ins label {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--mut)
    }

    .ins input {
      width: 64px;
      height: 42px;
      border: 1px solid var(--bd);
      border-radius: 6px;
      background: none;
      color: var(--tx);
      text-align: center;
      font: 15px Chakra Petch, Roboto
    }

    #gb {
      position: relative;
      height: 20px;
      margin: 26px 9px 4px;
      border-radius: 3px;
      touch-action: none
    }

    #gb i {
      position: absolute;
      top: -2px;
      width: 18px;
      height: 24px;
      border-radius: 4px;
      border: 2px solid #777;
      cursor: pointer
    }

    #gb i.sel {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .4)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 38px);
      gap: 2px;
      padding: 6px 8px
    }

    .grid .b {
      height: 38px;
      font-size: 20px
    }

    #zm {
      position: absolute;
      right: 16px;
      bottom: 12px;
      background: var(--pop);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--mut);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3)
    }

    .logo {
      width: 34px;
      height: 42px;
      border-radius: 5px;
      background: #ea4335;
      margin-right: 4px;
      display: grid;
      place-items: center
    }

    .ttl {
      display: flex;
      flex-direction: column
    }

    .trow {
      display: flex;
      align-items: center;
      gap: 4px
    }

    #title {
      font-size: 19px;
      width: 170px;
      field-sizing: content
    }

    #menus .mb,
    .mb {
      padding: 2px 9px;
      font-size: 14px
    }

    .b {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      flex: none;
      white-space: nowrap
    }

    .b.cb {
      flex-direction: column
    }

    .b.cb .sw {
      margin-top: 2px
    }

    i[data-ic] {
      display: inline-flex
    }

    .dd {
      display: inline-block;
      border: 4px solid transparent;
      border-top-color: currentColor;
      border-bottom: 0;
      margin-left: 2px;
      width: 0;
      height: 0
    }

    #star.on svg {
      fill: #f9ab00;
      stroke: #f9ab00
    }

    .grp {
      display: flex;
      align-items: center;
      gap: 2px
    }

    #tb>* {
      flex: none
    }

    #tb>.sp {
      flex: 1
    }

    .share {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #c2e7ff;
      color: #001d35;
      border-radius: 20px;
      padding: 0 6px 0 18px;
      height: 40px;
      font-weight: 500;
      font-size: 15px;
      margin-left: 8px
    }

    .share svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8
    }

    .shd {
      padding: 0 10px;
      border-left: 1px solid rgba(0, 0, 0, .2);
      height: 24px;
      display: flex;
      align-items: center
    }

    .big svg {
      width: 24px;
      height: 24px
    }

    #zoom {
      width: 76px
    }

    #ff {
      width: 128px
    }

    #fs {
      width: 38px;
      height: 26px;
      text-align: center;
      border: 1px solid var(--mut);
      border-radius: 4px;
      background: none;
      color: var(--tx);
      font: 14px Chakra Petch, Roboto
    }

    #tb {
      margin: 6px 16px;
      height: 42px
    }

    #rl {
      display: block;
      width: 100%;
      height: 22px
    }

    #hint {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 12px;
      max-width: min(640px, 92%);
      background: var(--pop);
      border-radius: 24px;
      padding: 8px 10px 8px 18px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
      font-size: 13px;
      z-index: 6
    }

    #hint button,
    #dlg button {
      border: 0;
      border-radius: 16px;
      padding: 7px 14px;
      background: var(--hv);
      color: var(--tx);
      cursor: pointer;
      font: 500 13px Chakra Petch, Roboto, Arial
    }

    #hint button:first-of-type,
    #dlg .pri {
      background: #3b82f6;
      color: #fff
    }

    #dlg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      display: none;
      place-items: center;
      z-index: 30
    }

    #dlg .card {
      background: var(--pop);
      border-radius: 12px;
      padding: 18px;
      width: min(520px, 92vw);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4)
    }

    #dlg h3 {
      margin: 0 0 10px;
      font: 500 16px Chakra Petch, Roboto, Arial
    }

    #dlg textarea {
      width: 100%;
      height: 200px;
      font: 12px monospace;
      background: var(--bg);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 8px;
      user-select: text
    }

    #dlg .row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px
    }

    #wrap.dz::after {
      content: 'Drop image to add it';
      position: absolute;
      inset: 8px;
      border: 2px dashed #3b82f6;
      border-radius: 12px;
      background: rgba(59, 130, 246, .08);
      display: grid;
      place-items: center;
      color: #3b82f6;
      font: 500 16px Chakra Petch, Roboto, Arial;
      pointer-events: none;
      z-index: 7
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      background: var(--pop);
      border-radius: 20px;
      padding: 8px 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
      z-index: 25;
      font-size: 13px
    }

    #ff {
      justify-content: space-between
    }

    #ffn {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100px
    }

    #tp {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 262px;
      display: none;
      flex-direction: column;
      gap: 6px;
      background: var(--pop);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
      z-index: 8
    }

    #tp textarea {
      width: 100%;
      height: 110px;
      resize: vertical;
      background: var(--bg);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 6px;
      font: 14px Chakra Petch, Roboto, Arial;
      user-select: text
    }

    #tp .hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      padding-left: 4px
    }

    .tpr {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap
    }

    #tp input[type=number] {
      width: 50px;
      height: 28px;
      text-align: center;
      border: 1px solid var(--mut);
      border-radius: 4px;
      background: none;
      color: var(--tx);
      font: 14px Chakra Petch, Roboto
    }

    .sq {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, .18);
      display: grid;
      place-items: center
    }

    .sq:hover {
      outline: 2px solid var(--ac)
    }

    .sq.cur {
      outline: 2px solid var(--ac);
      outline-offset: 1px
    }

    .sq.pl {
      background: var(--hv);
      border: 0;
      font-size: 17px;
      color: var(--tx)
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(10, 22px);
      gap: 3px;
      margin: 8px 0
    }

    .cr {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin: 6px 0
    }

    .cph {
      font-size: 12px;
      font-weight: 500;
      color: var(--mut)
    }

    .trb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 9px;
      cursor: pointer
    }

    .trb:hover {
      background: var(--hv)
    }

    #fdlg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: grid;
      place-items: center;
      z-index: 60
    }

    #fdlg .card {
      background: var(--bar);
      color: var(--tx);
      border-radius: 28px;
      padding: 24px 28px;
      width: min(760px, 94vw);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font: 14px Chakra Petch, Roboto, Arial
    }

    #fdlg h3 {
      margin: 0;
      font: 400 24px Chakra Petch, Roboto, Arial
    }

    #fdlg .fbar {
      display: flex;
      gap: 10px;
      align-items: center
    }

    #fdlg .fsrch {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--mut);
      border-radius: 24px;
      padding: 0 12px;
      height: 48px;
      flex: 1;
      min-width: 0;
      box-sizing: border-box
    }

    #fdlg .fsrch input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: none;
      outline: 0;
      color: var(--tx);
      font: 16px Chakra Petch, Roboto, Arial;
      user-select: text
    }

    #fdlg .fsel {
      position: relative;
      border: 1px solid var(--mut);
      border-radius: 8px;
      height: 48px;
      padding: 0 4px;
      display: flex;
      align-items: flex-end;
      box-sizing: border-box
    }

    #fdlg .fsel span {
      position: absolute;
      top: -9px;
      left: 8px;
      background: var(--bar);
      padding: 0 4px;
      font-size: 12px;
      color: var(--mut)
    }

    #fdlg .fsel select {
      border: 0;
      background: none;
      color: var(--tx);
      font: 16px Chakra Petch, Roboto, Arial;
      height: 100%;
      outline: 0;
      cursor: pointer
    }

    #fdlg .fcols {
      display: flex;
      gap: 12px;
      height: min(340px, 48vh)
    }

    #fdlg .fl {
      background: var(--pop);
      border-radius: 12px;
      overflow: auto;
      flex: 1
    }

    #fdlg .fr {
      flex: none;
      width: 230px
    }

    #fdlg .r {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      height: 48px;
      border-bottom: 1px solid var(--bd);
      cursor: pointer;
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden
    }

    #fdlg .r:hover {
      background: var(--hv)
    }

    #fdlg .fr .r {
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px 0 20px;
      font-size: 16px
    }

    #fdlg .r input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--ac);
      flex: none
    }

    #fdlg .ft {
      display: flex;
      align-items: center;
      gap: 8px
    }

    #fdlg .ft button {
      border: 0;
      background: none;
      color: var(--ac);
      font: 500 14px Chakra Petch, Roboto, Arial;
      padding: 10px 12px;
      border-radius: 20px;
      cursor: pointer
    }

    #fdlg .ft button:hover {
      background: var(--hv)
    }

    #fdlg .ft button.pri {
      background: var(--ac);
      color: #fff;
      padding: 12px 24px;
      font-size: 15px
    }

    #mh {
      position: absolute;
      left: 16px;
      bottom: 12px;
      display: none;
      max-width: min(360px, 40%);
      background: var(--pop);
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--tx);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
      white-space: pre-line;
      pointer-events: none;
      z-index: 6
    }

    .pop.big {
      padding: 8px 0;
      min-width: 0;
