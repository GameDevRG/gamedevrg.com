<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japanese listening practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap">
<style>
:root {
  --paper: #f3efe6; --ink: #1d2433; --accent: #a3342b; --panel: #e6e0d2; --line: #c9c0ad;
  --field: #fbf9f3; --muted: #6c6a63; --size: 30px;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151a24; --ink: #ece6d6; --accent: #e8806f; --panel: #1e2432; --line: #38405a;
    --field: #11151e; --muted: #9a98a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151a24; --ink: #ece6d6; --accent: #e8806f; --panel: #1e2432; --line: #38405a;
  --field: #11151e; --muted: #9a98a0; color-scheme: dark;
}
:root { --blue: #1f5fbf; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --blue: #7db2ff; } }
:root[data-theme="dark"] { --blue: #7db2ff; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { body { height: 100dvh; } }
body {
  background: var(--paper); color: var(--ink);
  font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden;
}
#stage { display: flex; flex-direction: column; align-items: center; padding: 20px; overflow: auto; min-height: 0; }
#card { margin: auto; width: 100%; max-width: 36em; display: grid; gap: 14px; text-align: center; }
#q { margin: 0; color: var(--muted); font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
#sent { margin: 0; font-size: var(--size); line-height: 2.4; font-weight: 500; overflow-wrap: anywhere; }
#sent rt { font-size: 0.5em; }
#sent[hidden], #en[hidden], #fb[hidden] { display: none; }
body.nofuri #sent rt { display: none; }
body.nofuri #sent { line-height: 1.9; }
#en { margin: 0; color: var(--muted); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.blank { display: inline-block; min-width: 1.6em; border-bottom: 2px solid var(--blue); line-height: 1.2; vertical-align: baseline; }
.ok { background: rgba(60,170,100,.3); border-radius: 4px; }
.bad { background: rgba(220,80,70,.3); border-radius: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
#ans {
  width: 100%; font: inherit; font-size: calc(var(--size) * .8); text-align: center; color: var(--ink);
  background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
#fb { text-align: left; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
#fb p { margin: 2px 0; }
.cmpw { overflow-x: auto; padding: 4px 0 6px; }
.cmp { display: inline-grid; grid-auto-flow: column; grid-template-rows: auto auto; gap: 2px 3px; font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 22px; line-height: 1.5; text-align: center; }
.cmp > span { min-width: 1.3em; border-radius: 4px; padding: 0 2px; }
.cmp > .lab { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted); align-self: center; text-align: right; padding-right: 8px; white-space: nowrap; }
.cmp > .gap { color: var(--muted); }
.w { cursor: pointer; border-radius: 4px; padding: 0 1px; }
.w:hover { background: rgba(128,128,128,.2); }
.w.sel { background: rgba(128,128,128,.3); }
#wc { position: fixed; z-index: 15; left: 0; top: 0; width: min(300px, calc(100vw - 16px)); text-align: left;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.25); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
#wc[hidden], #hl[hidden] { display: none; }
#hl { position: fixed; z-index: 5; pointer-events: none; left: 0; top: 0; }
#hl .hb { position: fixed; background: rgba(128,128,128,.3); border-radius: 4px; }
#wc .ww { font: 500 24px/1.3 "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; }
#wc .wsp { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; min-height: 0; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
#wc .wsp svg { display: block; }
#wc.hasq .ww { padding-right: 44px; }
#wc .wr { font-size: 14px; color: var(--muted); font-family: system-ui, sans-serif; }
#wc .wt { display: inline-block; font: 600 12px/1 system-ui, sans-serif; padding: 4px 8px; border-radius: 999px; border: 1px solid currentColor; letter-spacing: .02em; }
#wc .wtr { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
#wc .wt.p { color: #1f5fbf; background: rgba(31,95,191,.10); }
#wc .wt.a { color: #1d7a52; background: rgba(29,122,82,.10); }
#wc .wt.v { color: #8a5a00; background: rgba(138,90,0,.10); }
:root[data-theme="dark"] #wc .wt.p { color: #7db2ff; background: rgba(125,178,255,.14); }
:root[data-theme="dark"] #wc .wt.a { color: #6fd7a3; background: rgba(111,215,163,.14); }
:root[data-theme="dark"] #wc .wt.v { color: #e5b457; background: rgba(229,180,87,.14); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #wc .wt.p { color: #7db2ff; background: rgba(125,178,255,.14); }
  :root:not([data-theme="light"]) #wc .wt.a { color: #6fd7a3; background: rgba(111,215,163,.14); }
  :root:not([data-theme="light"]) #wc .wt.v { color: #e5b457; background: rgba(229,180,87,.14); }
}
#hl.k-p .hb { background: rgba(31,95,191,.28); }
#hl.k-a .hb { background: rgba(29,122,82,.28); }
#hl.k-v .hb { background: rgba(214,150,20,.28); }
#wc .wm { margin-top: 4px; }

#kbrow { margin: 0; color: var(--muted); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
#kbrow #kbtn { display: inline; background: none; border: 0; box-shadow: none; padding: 4px 0; min-height: 0; font: inherit; color: var(--blue); text-decoration: underline; cursor: pointer; }
#kb { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
#kb[hidden] { display: none; }
#kb button { padding: 0; min-height: 42px; font-size: 20px; font-family: inherit; border-radius: 6px; }
#kb button.ctl { font-size: 15px; background: var(--panel); }
#kb button:active { background: var(--line); }

#fb .t { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 20px; }
/* Four floating icon buttons, bottom right */
#panel { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: flex; gap: 10px; justify-content: flex-end; }
#panel button { width: 48px; height: 48px; min-height: 0; padding: 0; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#panel button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#panel button svg { display: block; }
/* Three-lines menu: popover on computers, bottom sheet on phones */
#menu { position: fixed; z-index: 12; display: block; width: 360px; max-width: calc(100vw - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px 16px 14px; box-shadow: 0 3px 14px rgba(0,0,0,.3); font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
#menu[hidden], #mback[hidden] { display: none; }
#menu .mgrip { display: none; }
#menu .mh { margin: 16px 0 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
#menu .mgrip + .mh { margin-top: 10px; }
#menu .mrow, #menu label.size { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; padding: 5px 0; color: var(--ink); }
#menu label.rate { grid-template-columns: 110px 1fr 3.2em; }
#menu button, #menu select { width: 100%; padding: 8px 10px; }
#menu input[type="range"] { width: 100%; }
#mback { display: none; position: fixed; inset: 0; z-index: 11; background: rgba(0,0,0,.4); }
@keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
button, select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; touch-action: manipulation; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; padding: 7px 20px; }
/* Selected buttons: a soft tint of the system accent color (muted slate fallback), as on the reading page */
#panel button[aria-pressed="true"], #menu button[aria-pressed="true"], #kb button[aria-pressed="true"], #card button[aria-pressed="true"] {
  background: #d6e2f5; color: var(--ink); border-color: #7a9fd8;
  background: color-mix(in srgb, var(--blue) 20%, var(--panel)); border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
}
:root[data-theme="dark"] #panel button[aria-pressed="true"], :root[data-theme="dark"] #menu button[aria-pressed="true"], :root[data-theme="dark"] #kb button[aria-pressed="true"], :root[data-theme="dark"] #card button[aria-pressed="true"] { background: #38405a; border-color: #6a7595; background: color-mix(in srgb, var(--blue) 28%, var(--panel)); border-color: color-mix(in srgb, var(--blue) 50%, var(--line)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #panel button[aria-pressed="true"], :root:not([data-theme="light"]) #menu button[aria-pressed="true"], :root:not([data-theme="light"]) #kb button[aria-pressed="true"], :root:not([data-theme="light"]) #card button[aria-pressed="true"] { background: #38405a; border-color: #6a7595; background: color-mix(in srgb, var(--blue) 28%, var(--panel)); border-color: color-mix(in srgb, var(--blue) 50%, var(--line)); } }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
button[hidden] { display: none; }
label.size { display: flex; gap: 6px; align-items: center; color: var(--muted); }
#score { color: var(--muted); text-align: left; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100px; height: 24px; background: transparent; margin: 0; padding: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--ink); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel); }
@media (pointer: coarse) {
  button, select { min-height: 42px; } select, #ans { font-size: 16px; }
  input[type="range"] { height: 36px; }
  input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -11px; }
}
@media (max-width: 700px) {
  html, body { height: auto; }
  body { display: flex; flex-direction: column; min-height: 100vh; overflow: auto; }
  #stage { flex: 1 0 auto; overflow: visible; padding: 12px 12px calc(86px + env(safe-area-inset-bottom, 0px)); }
  #menu { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-width: none; max-height: 78vh; max-height: 78dvh; border-radius: 16px 16px 0 0; border-bottom: 0;
    padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: sheet .22s ease-out; }
  #menu .mgrip { display: block; width: 44px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 6px; }
  #menu button, #menu select { min-height: 44px; }
  #mback { display: block; }
}
@media (prefers-reduced-motion: reduce) { #menu { animation: none; } }
</style>
</head>
<body>
<main id="stage">
  <div id="card">
    <p id="q"></p>
    <p id="sent" lang="ja" hidden></p>
    <p id="en" hidden></p>
    <div class="row">
      <button id="slow">Slower</button>
      <button id="part">Just the blank</button>
    </div>
    <input id="ans" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer">
    <div class="row">
      <button id="chk">Check</button>
      <button id="skip">Show answer</button>
    </div>
    <p id="kbrow"><span id="kbtxt"></span> <button type="button" id="kbtn"></button></p>
    <div id="kb" hidden aria-label="Hiragana keyboard"></div>
    <div id="fb" hidden></div>
    <p id="msg" style="margin:0;color:var(--muted);font:13px system-ui,sans-serif"></p>
  </div>
</main>

<section id="panel">
  <button id="hint" aria-pressed="false" aria-label="Translation" title="Show or hide the English translation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 5.5 7M12 5c-.7 3-3 6-7.5 8"/><path d="M12 20l4-9 4 9M13.5 17h5"/></svg></button>
  <button class="primary" id="next" aria-label="Next sentence" title="Next sentence (Enter)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 4v7h-7"/></svg></button>
  <button id="play" aria-label="Listen" title="Play the sentence again"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5v5h4l5 4v-13l-5 4H3z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12"/></svg></button>
  <button id="more" aria-expanded="false" aria-controls="menu" aria-label="Menu"><svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M1 1.5h18M1 7h18M1 12.5h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
</section>
<div id="menu" hidden>
  <div class="mgrip"></div>
  <div class="mh">Practice</div>
  <div class="mrow"><span>Exercise</span><select id="mode" aria-label="Exercise type">
    <option value="part">Type the missing part</option>
    <option value="full">Type the whole sentence</option>
  </select></div>
  <div class="mrow"><span>Typing</span><select id="inmode" aria-label="How you type">
    <option value="ime">My Japanese keyboard</option>
    <option value="romaji">Romaji → kana</option>
    <option value="kb">Built-in kana keyboard</option>
  </select></div>
  <div class="mh">Audio</div>
  <label class="size rate">Speed <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9" aria-label="Speech speed"><span id="rateV">0.9×</span></label>
  <div class="mh">Display</div>
  <div class="mrow"><span>Furigana</span><button id="furi" aria-pressed="true">Show furigana</button></div>
  <label class="size">Size <input type="range" id="size" min="20" max="56" value="30"></label>
  <div class="mrow"><span>Theme</span><button id="theme">Light / dark</button></div>
  <div class="mh">Progress</div>
  <div class="mrow"><span>Score</span><span id="score" aria-live="polite">0 / 0</span></div>
</div>
<div id="wc" hidden></div>
<div id="hl" hidden></div>
<div id="mback" hidden></div>

<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var rnd = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  var esc = function (t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
  var KJ = '[\\u4e00-\\u9fff々]+';
  var rb = function (t) { return esc(t).replace(new RegExp('(' + KJ + ')\\{([^}]+)\\}', 'g'), '<ruby>$1<rt>$2</rt></ruby>'); };
  var rd = function (t) { return t.replace(new RegExp(KJ + '\\{([^}]+)\\}', 'g'), '$1'); };
  var wr = function (t) { return t.replace(/\{[^}]*\}/g, ''); };
  var norm = function (s) {
    return s.normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 96); })
      .replace(/[\s、。，．,.?？!！・「」『』ー~〜]/g, '');
  };

  /* Sentences: segments split by |, kanji{reading}, then =English */
  var D = ('毎朝{まいあさ}|六時{ろくじ}に|起{お}きます=I wake up at six every morning.\n' +
  '私{わたし}は|昨日{きのう}|図書館{としょかん}で|本{ほん}を|読{よ}みました=Yesterday I read a book at the library.\n' +
  '友達{ともだち}と|喫茶店{きっさてん}で|お茶{ちゃ}を|飲{の}みました=I drank tea with a friend at a café.\n' +
  '来週{らいしゅう}|家族{かぞく}と|京都{きょうと}へ|行{い}きます=Next week I will go to Kyoto with my family.\n' +
  '今日{きょう}は|天気{てんき}が|いいですね=The weather is nice today, isn’t it?\n' +
  '駅{えき}は|あの|角{かど}の|隣{となり}に|あります=The station is next to that corner.\n' +
  '母{はは}は|毎晩{まいばん}|料理{りょうり}を|作{つく}ります=My mother cooks every evening.\n' +
  '先生{せんせい}は|とても|優{やさ}しい|人{ひと}です=The teacher is a very kind person.\n' +
  '昨夜{さくや}は|遅{おそ}くまで|映画{えいが}を|見{み}ました=Last night I watched a movie until late.\n' +
  '週末{しゅうまつ}に|公園{こうえん}を|散歩{さんぽ}します=On weekends I take a walk in the park.\n' +
  'すみません|駅{えき}は|どこですか=Excuse me, where is the station?\n' +
  'この|電車{でんしゃ}は|東京{とうきょう}に|行{い}きますか=Does this train go to Tokyo?\n' +
  '私{わたし}の|妹{いもうと}は|犬{いぬ}が|好{す}きです=My younger sister likes dogs.\n' +
  '雨{あめ}が|降{ふ}っているので|傘{かさ}を|持{も}っていきます=Since it is raining, I will take an umbrella.\n' +
  '毎日{まいにち}|日本語{にほんご}を|勉強{べんきょう}しています=I study Japanese every day.\n' +
  '田中{たなか}さんは|九時{くじ}に|会社{かいしゃ}に|着{つ}きました=Mr. Tanaka arrived at the office at nine.\n' +
  '冷蔵庫{れいぞうこ}に|牛乳{ぎゅうにゅう}が|あります=There is milk in the fridge.\n' +
  'この|レストランの|料理{りょうり}は|美味{おい}しいです=The food at this restaurant is delicious.\n' +
  '兄{あに}は|来年{らいねん}|大学{だいがく}を|卒業{そつぎょう}します=My older brother will graduate from university next year.\n' +
  '日曜日{にちようび}に|友達{ともだち}と|買{か}い物{もの}に|行{い}きました=On Sunday I went shopping with a friend.\n' +
  '窓{まど}を|開{あ}けても|いいですか=May I open the window?\n' +
  'もう|少{すこ}し|ゆっくり|話{はな}してください=Please speak a little more slowly.\n' +
  '夏休{なつやす}みに|海{うみ}へ|泳{およ}ぎに|行{い}きたいです=I want to go swimming at the sea during summer vacation.\n' +
  '彼女{かのじょ}は|ピアノを|弾{ひ}くのが|上手{じょうず}です=She is good at playing the piano.\n' +
  '昨日{きのう}は|頭{あたま}が|痛{いた}かったので|早{はや}く|寝{ね}ました=I had a headache yesterday, so I went to bed early.\n' +
  '図書館{としょかん}は|九時{くじ}から|五時{ごじ}まで|開{あ}いています=The library is open from nine to five.\n' +
  '駅{えき}まで|歩{ある}いて|十分{じゅっぷん}ぐらいです=It takes about ten minutes to walk to the station.\n' +
  '公園{こうえん}に|大{おお}きい|木{き}が|あります=There is a big tree in the park.\n' +
  '電話{でんわ}を|かけても|いいですか=May I make a phone call?\n' +
  'この|本{ほん}は|思{おも}ったより|面白{おもしろ}かったです=This book was more interesting than I expected.').split('\n').map(function (l) {
    var p = l.split('='); return { s: p[0].split('|'), en: p[1] };
  });

  function swap(c, t) { var i = t.indexOf(c); return i < 0 ? null : t.charAt(i % 2 ? i - 1 : i + 1); }
  (function () {
    var h = '';
    KB.forEach(function (r) { r.split('').reverse().forEach(function (c) { h += c === '.' ? '<span></span>' : '<button type="button" data-k="' + c + '">' + c + '</button>'; }); });
    CTL.forEach(function (c) { h += '<button type="button" class="ctl" data-k="' + c + '">' + c + '</button>'; });
    kb.innerHTML = h;
  })();
  function kbPress(t) {
    var a = $('ans'); if (done || a.disabled) return;
    a.focus({ preventScroll: true });
    var s = a.selectionStart == null ? a.value.length : a.selectionStart, e = a.selectionEnd == null ? s : a.selectionEnd, v = a.value;
    if (t === '⌫') { if (s === e && s > 0) s--; a.setRangeText('', s, e, 'end'); return; }
    if (t === '消') { a.value = ''; return; }
    if (t === 'カナ') {
      kata = !kata;
      Array.prototype.forEach.call(kb.querySelectorAll('button'), function (b) { var k = b.getAttribute('data-k'); if (k === 'カナ') b.setAttribute('aria-pressed', kata); else if (!b.classList.contains('ctl')) b.textContent = kata ? h2k(k) : k; });
      return;
    }
    if (t === '゛' || t === '゜' || t === '小') {
      if (s !== e || s === 0) return;
      var p = v.charAt(s - 1), wasK = /[\u30a1-\u30f6]/.test(p), c = k2h(p), r = null, i;
      if (t === '小') r = swap(c, SM);
      else if (t === '゛') { r = VO.indexOf(c) > -1 ? swap(c, VO) : null; if (!r && SE.indexOf(c) % 2 === 1) r = swap(SE.charAt(SE.indexOf(c) - 1), VO); }
      else { r = SE.indexOf(c) > -1 ? swap(c, SE) : null; i = VO.indexOf(c); if (!r && i % 2 === 1 && SE.indexOf(VO.charAt(i - 1)) > -1) r = SE.charAt(SE.indexOf(VO.charAt(i - 1)) + 1); }
      if (r) a.setRangeText(wasK ? h2k(r) : r, s - 1, s, 'end');
      return;
    }
    a.setRangeText(kata ? h2k(t) : t, s, e, 'end');
  }
  kb.addEventListener('mousedown', function (e) { e.preventDefault(); });
  kb.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('button'); if (b) kbPress(b.getAttribute('data-k')); });
  function applyIn() {
    var m = $('inmode').value, k = m === 'kb';
    kb.hidden = !k; $('ans').inputMode = k ? 'none' : 'text';
    $('ans').placeholder = 'ここに書いて';
    $('kbtxt').textContent = k ? 'Using the built-in keyboard.' : 'No Japanese keyboard?';
    $('kbtn').textContent = k ? 'Use my own keyboard' : 'Use the built-in one';
  }
  $('inmode').addEventListener('change', function () { applyIn(); closeMenu(); $('ans').focus(); });
  $('kbtn').onclick = function () { $('inmode').value = $('inmode').value === 'kb' ? 'ime' : 'kb'; applyIn(); $('ans').focus(); };
  applyIn();
  if (TTS && TTS.onvoiceschanged !== undefined) TTS.onvoiceschanged = function () {};
  next();
})();
