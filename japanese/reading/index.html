<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japanese reading practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap">
<style>
:root {
  --paper: #f3efe6; --ink: #1d2433; --accent: #a3342b; --panel: #e6e0d2; --line: #c9c0ad;
  --field: #fbf9f3; --muted: #6c6a63; --size: clamp(28px, 6vw, 56px);
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151a24; --ink: #ece6d6; --accent: #e8806f; --panel: #1e2432; --line: #38405a;
    --field: #11151e; --muted: #9a98a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151a24; --ink: #ece6d6; --accent: #e8806f; --panel: #1e2432; --line: #38405a;
  --field: #11151e; --muted: #9a98a0; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { body { height: 100dvh; } }
body {
  background: var(--paper); color: var(--ink);
  font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden;
}
#stage { display: flex; flex-direction: column; align-items: center; padding: 24px; overflow: auto; min-height: 0; }
#read { margin: auto; width: 100%; max-width: 34em; display: grid; gap: 1.1em; }
#jp { margin: 0; font-size: var(--size); line-height: 2.3; font-weight: 500; overflow-wrap: anywhere; text-align: left; }
#jp rt { font-size: 0.5em; font-weight: 500; }
#jp .s { cursor: pointer; border-radius: 4px; padding: 2px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
body.nofuri #jp ruby:not(.rev) rt { display: none; }
body.nofuri #jp ruby { cursor: help; }
body.nofuri #jp { line-height: 1.9; }
#en {
  margin: 0; padding-top: .8em; border-top: 1px solid var(--line); color: var(--muted);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
#en[hidden] { display: none; }
.hint { margin: 0; color: var(--muted); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
#panel {
  background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px 12px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, select {
  font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer;
}
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; padding: 7px 20px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.size { display: flex; gap: 6px; align-items: center; color: var(--muted); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 110px; height: 24px; background: transparent; margin: 0; padding: 0; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--ink);
}
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel); }
@media (pointer: coarse) {
  button, select { min-height: 42px; }
  select { font-size: 16px; }
  input[type="range"] { height: 36px; }
  input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -11px; }
}
@media (max-width: 600px) { #stage { padding: 14px; } .tip { display: none; } }
.tip { color: var(--muted); }
#gm {
  position: fixed; z-index: 20; left: 0; top: 0; width: min(400px, calc(100vw - 16px)); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
  box-shadow: 0 3px 12px rgba(0,0,0,.25); font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
}
#gm[hidden] { display: none; }
#gm .gtop { display: flex; gap: 6px; flex-wrap: wrap; }
#gm .gh { margin: 10px 4px 2px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .05em; }
#gm label { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 6px; cursor: pointer; }
#gm label:hover { background: rgba(255,190,0,.18); }
#gm input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--ink); }
@media (pointer: coarse) { #gm label { padding: 10px 6px; } }
#wc {
  position: fixed; z-index: 15; left: 0; top: 0; width: min(300px, calc(100vw - 16px));
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.25); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
#wc[hidden] { display: none; }
#hl { position: fixed; z-index: 5; pointer-events: none; left: 0; top: 0; }
#hl .hb { position: fixed; background: rgba(128,128,128,.3); border-radius: 4px; }
#hl[hidden] { display: none; }
#wc .ww { font: 500 24px/1.3 "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; }
#wc .wsp { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
#wc .wsp svg { display: block; }
#wc .wsp.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#wc.hasq .ww { padding-right: 44px; }
#wc .wr { font-size: 14px; color: var(--muted); font-family: system-ui, sans-serif; }
#wc .wt { display: inline-block; font: 600 12px/1 system-ui, sans-serif; padding: 4px 8px; border-radius: 999px; border: 1px solid currentColor; letter-spacing: .02em; }
#wc .wtr { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
#wc .wts { font-size: 13px; color: var(--muted); }
#wc .wt.p { color: #1f5fbf; background: rgba(31,95,191,.10); }
#wc .wt.a { color: #1d7a52; background: rgba(29,122,82,.10); }
#wc .wt.v { color: #8a5a00; background: rgba(138,90,0,.10); }
:root[data-theme="dark"] #wc .wt.p { color: #7db2ff; background: rgba(125,178,255,.14); }
:root[data-theme="dark"] #wc .wt.a { color: #6fd7a3; background: rgba(111,215,163,.14); }
:root[data-theme="dark"] #wc .wt.v { color: #e5b457; background: rgba(229,180,87,.14); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #wc .wt.p { color: #7db2ff; background: rgba(125,178,255,.14); }
  :root:not([data-theme="light"]) #wc .wt.a { color: #6fd7a3; background: rgba(111,215,163,.14); }
  :root:not([data-theme="light"]) #wc .wt.v { color: #e5b457; background: rgba(229,180,87,.14); }
}
#hl.k-p .hb { background: rgba(31,95,191,.28); }
#hl.k-a .hb { background: rgba(29,122,82,.28); }
#hl.k-v .hb { background: rgba(214,150,20,.28); }
#wc .wm { margin-top: 4px; }
#wc .wf { margin-top: 6px; color: var(--muted); }
#wc .wf b { color: var(--ink); font-weight: 600; margin-right: 8px; }
#wc .wn { margin-top: 3px; font-size: 13px; color: var(--muted); }
#wc .wkl { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: grid; gap: 2px; color: var(--muted); }
#wc .wk b { color: var(--ink); font: 500 16px "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; margin-right: 6px; }
button, select { touch-action: manipulation; }
#jp .s { -webkit-tap-highlight-color: transparent; }
body.tate #read { max-width: 100%; }
body.tate #jp { writing-mode: vertical-rl; width: 100%; height: 62vh; height: 62dvh; min-height: 14em; overflow-x: auto; overflow-y: hidden; line-height: 2.1; padding: 0 4px; }
body.tate #jp .pb { height: auto; width: .9em; }
body.tate.nofuri #jp { line-height: 1.8; }
#jp .s.say { background: rgba(255,190,0,.28); }
label.rate span { min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
#menu label.rate { grid-template-columns: 90px 1fr 3.2em; }
#more { display: inline-block; }
#more svg { display: block; }
#jp .pb { display: block; height: .9em; }
@media (max-width: 700px) {
  html, body { height: auto; }
  body { display: flex; flex-direction: column; min-height: 100vh; overflow: auto; }
  #panel { order: -1; border-top: 0; border-bottom: 1px solid var(--line); }
  #stage { flex: 1 0 auto; overflow: visible; }
  .emb #panel { padding-top: 56px; }
}

#menu {
  position: fixed; z-index: 12; left: 8px; right: 8px; bottom: 0; display: grid; gap: 10px; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  box-shadow: 0 3px 14px rgba(0,0,0,.3); font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
}
#menu[hidden] { display: none; }
#menu .mrow, #menu label.size { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; color: var(--muted); }
#menu button, #menu select { width: 100%; padding: 10px; }
#menu input[type="range"] { width: 100%; }
@media (max-width: 700px) {
  #panel { gap: 6px; padding: 8px 10px; }
  #panel button, #panel select { padding: 8px 10px; }
  #more { display: inline-block; }
  #new { flex: 1 1 auto; }
  #panel:not(.open) .x { display: none; }
  .x { order: 2; }
  #panel label.size.x { flex: 1 1 100%; }
  #panel label.size.x input { flex: 1; }
  #stage { padding: 14px 14px 8px; }
  .hint { font-size: 12px; }
}

/* Three-lines menu: popover on computers, bottom sheet on phones */
.tip { display: none !important; }
#menu { display: block; left: auto; right: auto; top: auto; bottom: auto; width: 360px; max-width: calc(100vw - 16px); padding: 6px 16px 14px; border-radius: 12px; overflow: auto; }
#menu .mgrip { display: none; }
#menu .mh { margin: 16px 0 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
#menu .mgrip + .mh, #menu > .mh:first-child { margin-top: 10px; }
#menu .mrow, #menu label.size { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; padding: 5px 0; color: var(--ink); }
#menu label.rate { grid-template-columns: 110px 1fr 3.2em; }
#menu button, #menu select { width: 100%; padding: 8px 10px; }
#mback { display: none; position: fixed; inset: 0; z-index: 11; background: rgba(0,0,0,.4); }
#mback[hidden] { display: none; }
@keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
@media (max-width: 700px) {
  #menu { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-width: none; max-height: 78vh; max-height: 78dvh; border-radius: 16px 16px 0 0; border-bottom: 0;
    padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: sheet .22s ease-out; }
  #menu .mgrip { display: block; width: 44px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 6px; }
  #menu button, #menu select { min-height: 44px; }
  #mback { display: block; }
}
@media (prefers-reduced-motion: reduce) { #menu { animation: none; } }

/* Four floating icon buttons, bottom right */
#panel { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: auto; top: auto; z-index: 10;
  width: auto; order: 0; background: transparent; border: 0; padding: 0; gap: 10px; flex-wrap: nowrap; justify-content: flex-end; }
.emb #panel { padding-top: 0; }
#panel button { width: 48px; height: 48px; min-height: 0; padding: 0; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#panel button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#panel button[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent); }
#panel button[hidden] { display: none; }
#panel button svg { display: block; }
#stage { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 700px) { #stage { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } #panel { order: 0; border: 0; padding: 0; gap: 10px; } }

/* Pitch accent */
:root { --pa0: #1f5fbf; --pa1: #c0392b; --pa2: #1d7a52; --pa3: #8a4bbf; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pa0: #7db2ff; --pa1: #ff8f80; --pa2: #6fd7a3; --pa3: #c9a2f5; } }
:root[data-theme="dark"] { --pa0: #7db2ff; --pa1: #ff8f80; --pa2: #6fd7a3; --pa3: #c9a2f5; }
#jp { position: relative; }
#jp .pal { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
#jp .pau { position: absolute; border-radius: 2px; opacity: .85; pointer-events: none; }
.pau.c0, .mleg .c0::before { background: var(--pa0); } .pau.c1, .mleg .c1::before { background: var(--pa1); }
.pau.c2, .mleg .c2::before { background: var(--pa2); } .pau.c3, .mleg .c3::before { background: var(--pa3); }
#menu .mleg { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 0 6px; font-size: 12px; color: var(--muted); }
#menu .mleg span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
#wc .wpa { margin-top: 8px; padding: 8px 0 2px; border-top: 1px solid var(--line); }
#wc .wpa.t0 { --pc: var(--pa0); } #wc .wpa.t1 { --pc: var(--pa1); } #wc .wpa.t2 { --pc: var(--pa2); } #wc .wpa.t3 { --pc: var(--pa3); }
#wc .wpa .wt { color: var(--pc); background: transparent; }
#wc .wpm { margin-top: 8px; display: flex; flex-wrap: wrap; }
#wc .pm { min-width: 1.5em; padding: 6px 1px 1px; text-align: center; font: 500 18px "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; border-top: 2px solid transparent; border-right: 2px solid transparent; }
#wc .pm.h { border-top-color: var(--pc); } #wc .pm.d { border-right-color: var(--pc); }
#wc .pm.pp { color: var(--muted); font-size: 14px; }
#menu .hint { margin: 4px 0 6px; font-size: 12.5px; line-height: 1.5; }
#menu .hint:empty { display: none; }
/* Stop button floats directly above the Listen button (the rightmost one) */
#panel #stopbtn { position: absolute; right: 0; bottom: 58px; }
/* Selected buttons: a soft tint of the system accent color (muted slate fallback) */
#panel button[aria-pressed="true"], #menu button[aria-pressed="true"] {
  background: #d3d9e6; color: var(--ink); border-color: #8e9ab5;
  background: color-mix(in srgb, AccentColor 20%, var(--panel)); border-color: color-mix(in srgb, AccentColor 50%, var(--line));
}
:root[data-theme="dark"] #panel button[aria-pressed="true"], :root[data-theme="dark"] #menu button[aria-pressed="true"] { background: #38405a; border-color: #6a7595; background: color-mix(in srgb, AccentColor 28%, var(--panel)); border-color: color-mix(in srgb, AccentColor 50%, var(--line)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #panel button[aria-pressed="true"], :root:not([data-theme="light"]) #menu button[aria-pressed="true"] { background: #38405a; border-color: #6a7595; background: color-mix(in srgb, AccentColor 28%, var(--panel)); border-color: color-mix(in srgb, AccentColor 50%, var(--line)); } }
</style>
</head>
<body>
<main id="stage">
  <div id="read">
    <p id="jp" lang="ja"></p>
    <p id="en" hidden></p>
    <p class="hint" id="hint">Tap a word to see its meaning and whether it is a particle, an auxiliary verb or vocabulary. With furigana off, tapping also peeks at the reading.</p>
    <p class="hint" id="chk"></p>
  </div>
</main>

<section id="panel">
  <button id="back" title="Previous (Left arrow)">Back</button>
  <button class="primary" id="new" aria-label="New passage" title="New passage (Space or Right arrow)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 4v7h-7"/></svg></button>
  <select id="lvl" class="x" aria-label="JLPT level" title="Reading level (sets the default grammar)">
    <option value="N5">N5</option>
    <option value="N4">N4</option>
    <option value="N3">N3</option>
    <option value="N2">N2</option>
    <option value="N1">N1</option>
  </select>
  <select id="mode" class="x" aria-label="Mode" title="Random: unrelated sentences. Connected: one person, place and event. Narrative: a short story with a beginning, middle and end.">
    <option value="random">Random</option>
    <option value="connected">Connected</option>
    <option value="narrative">Narrative</option>
  </select>
  <select id="top" class="x" aria-label="Topic" title="Topic">
    <option value="">Any topic</option>
    <option value="food">Food</option>
    <option value="travel">Travel</option>
    <option value="school">School</option>
    <option value="nature">Nature</option>
    <option value="hobby">Hobbies</option>
  </select>
  <select id="len" class="x" aria-label="Length">
    <option value="1">1 sentence</option>
    <option value="3">3 sentences</option>
    <option value="5" selected>5 sentences</option>
    <option value="8">8 sentences</option>
    <option value="12">12 sentences (long)</option>
    <option value="20">20 sentences (very long)</option>
    <option value="30">30 sentences (extra long)</option>
  </select>
  <button id="gbtn" class="x" aria-haspopup="true" title="Choose which grammar to practice">Grammar</button>
  <button id="furi" aria-pressed="true">Furigana</button>
  <button id="eng" aria-pressed="false" aria-label="Translation" title="Show or hide the translation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 5.5 7M12 5c-.7 3-3 6-7.5 8"/><path d="M12 20l4-9 4 9M13.5 17h5"/></svg></button>
  <button id="stopbtn" aria-label="Stop" title="Stop reading" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg></button>
  <button id="listen" aria-pressed="false" aria-label="Listen" title="Read the passage aloud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5v5h4l5 4v-13l-5 4H3z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12"/></svg></button>
  <button id="more" aria-expanded="false" aria-controls="menu" aria-label="Menu"><svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M1 1.5h18M1 7h18M1 12.5h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
  <button id="casual" class="x" aria-pressed="false" title="Casual speech: plain forms instead of polite です/ます">Casual</button>
  <button id="spk" class="x" aria-pressed="false" title="Send the kanji text to the voice instead of the furigana reading">Send kanji text</button>
  <select id="voice" class="x" aria-label="Voice" title="Japanese voice (the list depends on your device)"></select>
  <label class="size x rate" id="rateRow" title="Speech speed">Speed <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9" aria-label="Speech speed"><span id="rateV">0.9×</span></label>
  <button id="pa" class="x" aria-pressed="false" title="Underline words by pitch accent pattern">Show accent</button>
  <button id="vert" class="x" aria-pressed="false" title="Vertical writing (tategaki), read right to left">Vertical</button>
  <button id="copy" class="x">Copy</button>
  <label class="size x">Size <input type="range" id="size" min="14" max="48" value="22"></label>
  <button id="theme" class="x">Light / dark</button>
  <span class="tip x">Space = new</span>
</section>

<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var rnd = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  var art = function (w) { return (/^[aeiou]/.test(w) ? 'an ' : 'a ') + w; };

  });

  /* Three-lines menu: on narrow screens the extra controls move into a popup */
  var BARS = '<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M1 1.5h18M1 7h18M1 12.5h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
  var CLOSE = '<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M4 1l12 12M16 1L4 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
  var menu = document.createElement('div');
  menu.id = 'menu'; menu.hidden = true;
  document.body.appendChild(menu);
  if (window.self !== window.top) document.documentElement.classList.add('emb');
  var mb = document.createElement('div');
  mb.id = 'mback'; mb.hidden = true;
  document.body.appendChild(mb);
  mb.addEventListener('click', function () { closeMenu(); });
  var mq = window.matchMedia('(max-width: 700px)');
  function closeMenu() {
    menu.hidden = true; mb.hidden = true;
    $('more').setAttribute('aria-expanded', 'false');
    $('more').innerHTML = BARS;
    if (!gm.hidden) closeGm();
  }
  function openMenu() {
    var r = $('more').getBoundingClientRect();
    menu.hidden = false;
    if (mq.matches) {
      menu.style.left = menu.style.right = menu.style.top = menu.style.bottom = menu.style.maxHeight = '';
      mb.hidden = false;
    } else {
      mb.hidden = true;
      var mw = menu.offsetWidth, vw = window.innerWidth, vh = window.innerHeight;
      menu.style.right = 'auto';
      menu.style.left = Math.max(8, Math.min(r.right - mw, vw - mw - 8)) + 'px';
      if (r.top < vh / 2) {
        menu.style.bottom = 'auto'; menu.style.top = (r.bottom + 8) + 'px';
        menu.style.maxHeight = Math.max(200, vh - r.bottom - 16) + 'px';
      } else {
        menu.style.top = 'auto'; menu.style.bottom = (vh - r.top + 8) + 'px';
        menu.style.maxHeight = Math.max(200, r.top - 16) + 'px';
      }
    }
    $('more').setAttribute('aria-expanded', 'true');
    $('more').innerHTML = CLOSE;
  }
  /* Every secondary control lives in the menu, grouped under headings */
  var MENU_GROUPS = [['Reading', ['mode', 'lvl', 'top', 'len', 'gbtn', 'casual']], ['Display', ['furi', 'size', 'vert', 'pa', 'theme']], ['Audio', ['voice', 'rateRow', 'spk']], ['Tools', ['back', 'copy']]];
  var MENU_LABEL = { gbtn: 'Grammar', casual: 'Speech style', vert: 'Writing', theme: 'Theme', copy: 'Passage', furi: 'Furigana', back: 'History', pa: 'Pitch accent', spk: 'Speech text' };
  (function buildMenu() {
    var grip = document.createElement('div');
    grip.className = 'mgrip'; menu.appendChild(grip);
    MENU_GROUPS.forEach(function (g) {
      var h = document.createElement('div');
      h.className = 'mh'; h.textContent = g[0]; menu.appendChild(h);
      g[1].forEach(function (id) {
        var el = id === 'size' ? $('size').parentNode : $(id);
        if (!el) return;
        if (el.tagName === 'LABEL') { menu.appendChild(el); return; }
        var row = document.createElement('div'), lab = document.createElement('span');
        row.className = 'mrow';
        lab.textContent = MENU_LABEL[id] || el.getAttribute('aria-label') || '';
        row.appendChild(lab); row.appendChild(el); menu.appendChild(row);
        if (id === 'pa') {
          var lg = document.createElement('div');
          lg.className = 'mleg';
          lg.innerHTML = '<span class="c0">Flat (heiban)</span><span class="c1">High then drop (atamadaka)</span><span class="c2">Drop in the middle (nakadaka)</span><span class="c3">Drop at the end (odaka)</span>';
          menu.appendChild(lg);
        }
      });
    });
    var ih = document.createElement('div');
    ih.className = 'mh'; ih.textContent = 'Info'; menu.appendChild(ih);
    menu.appendChild($('hint')); menu.appendChild($('chk'));
    $('gbtn').textContent = 'Choose\u2026';
    $('spk').textContent = 'Send kanji text';
    $('furi').textContent = 'Show furigana'; $('back').textContent = 'Previous passage';
    $('back').addEventListener('click', function () { closeMenu(); });
    ['more', 'eng', 'new', 'stopbtn', 'listen'].forEach(function (id) { $('panel').appendChild($(id)); });
  })();
  if (mq.addEventListener) mq.addEventListener('change', closeMenu); else mq.addListener(closeMenu);
  var hovRaf = 0;
  $('jp').addEventListener('mousemove', function (e) {
    if (hovRaf || !wc.hidden) return;
    var x = e.clientX, y = e.clientY, t = e.target;
    hovRaf = requestAnimationFrame(function () {
      hovRaf = 0;
      var sp = t.closest && t.closest('.s'), w = sp && wordAt(sp, x, y);
      if (wc.hidden) setHl(w ? w.rects : null);
    });
  });
  $('jp').addEventListener('wheel', function (e) {
    if (!document.body.classList.contains('tate') || e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault(); this.scrollLeft -= e.deltaY;
  }, { passive: false });
  $('jp').addEventListener('mouseleave', function () { if (wc.hidden) setHl(null); });
  window.addEventListener('scroll', function () { if (wc.hidden) setHl(null); }, true);
  $('more').addEventListener('click', function () { if (menu.hidden) openMenu(); else closeMenu(); });
  document.addEventListener('pointerdown', function (e) {
    if (!menu.hidden && !menu.contains(e.target) && !gm.contains(e.target) && !$('more').contains(e.target)) closeMenu();
  });
  if (window.matchMedia('(pointer: coarse)').matches) {
    $('hint').textContent += ' Swipe left for a new passage, right to go back.';
  }
  var tx = 0, ty = 0;
  $('stage').addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  $('stage').addEventListener('touchend', function (e) {
    if (String(window.getSelection()) || document.body.classList.contains('tate')) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) {
      if (dx < 0) fresh(); else if (idx > 0) { idx--; render(); }
    }
  }, { passive: true });

  load(); apply(); fresh();
})();
</script>
</body>
