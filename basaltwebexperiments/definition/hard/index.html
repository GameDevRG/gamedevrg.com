<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Definition Game</title>
  <style>
    body {
      background: #0b0b0b;
      color: #eaeaea;
      font-family: helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 10px;
      transition: filter 0.25s ease;
    }

    body.blurred > *:not(.overlay) {
      filter: blur(6px);
    }

    #definition {
      font-size: 22px;
      text-align: center;
      margin-bottom: 12px;
    }

    #timer {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    input {
      width: 300px;
      padding: 10px;
      font-size: 18px;
      border-radius: 6px;
      border: 2px solid #333;
      background: #111;
      color: #eaeaea;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 16px;
      margin-top: 10px;
    }

    button.control {
      padding: 10px 22px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: #fff;
    }

    .submit { background: #1e8b3c; color: #000; }
    .scores { background: #444; }
    .skip { background: #c0392b; color: #fff; }

    #typedWordsLabel {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }

    #typedWords {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }

    .typedWord {
      background: rgba(255,0,0,0.25);
      color: #ff7e7e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .flash {
      animation: flashAnim 0.3s ease;
    }

    @keyframes flashAnim {
      0% { background: #fff; color: #ffffff; }
      100% { background: rgba(255,0,0,0.25); color: #ff0000; }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .overlay.active { display: flex; }

    .modal {
      background: #111;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 20px;
      min-width: 360px;
      max-height: 70vh;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #333;
      padding: 6px;
      text-align: center;
    }

    th { background: #151515; }

    .close {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

  <div id="definition"></div>
  <div id="timer">Time elapsed: 0.00s</div>
  <input id="inputWord" placeholder="Type the word here" autofocus />

    <button class="control submit" id="submit">submit [enter]</button>
    <button class="control skip" id="skip">skip</button>

    const history = [];

    const definitionEl = document.getElementById('definition');
    const timerEl = document.getElementById('timer');
    const inputWord = document.getElementById('inputWord');
    const scoreTable = document.getElementById('scoreTable');
    const overlay = document.getElementById('overlay');
    const typedWordsEl = document.getElementById('typedWords');

    function updateTimer() {
      if (!startTime) return;
      const time = ((performance.now() - startTime)/1000).toFixed(2);
      timerEl.textContent = `Time elapsed: ${time}s`;
    }

    function startTimer() {
      startTime = performance.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 100);
    }

    function renderScores() {
      scoreTable.innerHTML = '';
      history.forEach((h,i)=>{
        const row = document.createElement('tr');
        row.innerHTML = `<td>${i+1}</td><td>${h.definition}</td><td>${h.word}</td><td>${h.time}</td>`;
        scoreTable.appendChild(row);
      });
    }

    function getRandomDefinition() {
      if(definitions.length === 0) return null;
      const randomIndex = Math.floor(Math.random() * definitions.length);
      return { defObj: definitions[randomIndex], index: randomIndex };
    }

    function nextDefinition() {
      const result = getRandomDefinition();
      if(!result) return;
      const { defObj, index } = result;
      definitionEl.textContent = defObj.def;
      definitionEl.dataset.index = index;
      inputWord.value = '';
      defObj.used = defObj.used || [];
      startTimer();
    }

    function flashWord(wordEl) {
      wordEl.classList.remove('flash');
      void wordEl.offsetWidth;
      wordEl.classList.add('flash');
    }

    function addRedBox(val, currentDef) {
      const lowerVal = val.toLowerCase();
      const existing = Array.from(typedWordsEl.children).find(span => span.textContent.toLowerCase() === lowerVal);
      if(existing) {
        flashWord(existing);
        return;
      }
      const wordBox = document.createElement('span');
      wordBox.className = 'typedWord';
      wordBox.textContent = val;
      typedWordsEl.appendChild(wordBox);
      flashWord(wordBox);
      currentDef.used.push(lowerVal);
    }

    function submitAnswer() {
      const val = inputWord.value.trim();
      if(!val) return;
      const defIndex = definitionEl.dataset.index;
      const currentDef = definitions[defIndex];
      if(!currentDef) return;

      const lowerVal = val.toLowerCase();
      const answerIndex = currentDef.answers.findIndex(a=>a.toLowerCase() === lowerVal);

      if(answerIndex !== -1) {
        addRedBox(val, currentDef);
        currentDef.answers.splice(answerIndex,1);
        const time = ((performance.now() - startTime)/1000).toFixed(2);
        history.push({ definition: currentDef.def, word: val, time });
        inputWord.value = '';
        nextDefinition();
      } else {
        // do nothing for incorrect guesses
        inputWord.value = '';
      }
    }

    function skipDefinition() {
      nextDefinition();
    }

    document.getElementById('skip').addEventListener('click', skipDefinition);
    document.getElementById('submit').addEventListener('click', submitAnswer);

    inputWord.addEventListener('keydown', e=>{
      if(e.key==='Enter') {
        e.preventDefault();
        submitAnswer();
      }
    });

    document.getElementById('scores').addEventListener('click', ()=>{
      renderScores();
      overlay.classList.add('active');
      document.body.classList.add('blurred');
    });

    document.getElementById('closeModal').addEventListener('click', ()=>{
      overlay.classList.remove('active');
      document.body.classList.remove('blurred');
    });

    nextDefinition();
  </script>
</body>
</html>
